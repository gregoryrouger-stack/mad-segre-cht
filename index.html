<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAD Segré/CHT</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#6d1a4f">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --bordeaux:#6d1a4f;
    --bordeaux-dark:#551340;
    --bordeaux-light:#8a3670;
    --bordeaux-tint:#c98fb0;
    --gold:#e8b84b;
    --ink:#1f1a1e;
    --paper:#ffffff;
    --mist:#f6f3f5;
    --line:#e7e1e5;
    --cyan:#cdeaec;
    --ok:#2f8f5b;
    --warn:#c0392b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; width:100%;}
  body{ touch-action:pan-y; overscroll-behavior-x:none; }
  #app{ overflow-x:hidden; width:100%; }
  body{
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  #app{flex:1; display:flex; flex-direction:column;}

  .sticky-head{
    /* n'est plus figé : défile normalement avec le contenu */
  }

  header.topbar{
    background:linear-gradient(180deg,var(--bordeaux) 0%, var(--bordeaux-dark) 100%);
    color:white;
    padding:16px 20px 0 20px;
    display:flex; align-items:center; justify-content:space-between; gap:24px;
  }
  .topbar-inner{ flex:1; min-width:0; }
  .topbar-logo{
    flex-shrink:0; background:white; border-radius:12px;
    padding:8px 18px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .topbar-logo img{ height:44px; width:auto; display:block; }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-weight:800; font-size:19px; letter-spacing:.2px;
    padding-bottom:14px;
  }
  nav.tabs{
    display:flex; gap:4px; flex-wrap:wrap;
    padding-bottom:0; touch-action:pan-x;
  }
  nav.tabs button{
    background:transparent; border:none; color:rgba(255,255,255,.85);
    padding:10px 14px; font-size:14px; font-weight:600;
    border-radius:10px 10px 0 0; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button:hover{ background:rgba(255,255,255,.08); }
  nav.tabs button.active{ background:var(--paper); color:var(--bordeaux); }
  nav.tabs .tab-icon{ display:none; }
  nav.tabs .badge{
    background:var(--warn); color:white; font-size:12px; font-weight:700;
    border-radius:999px; padding:2px 7px; margin-left:3px; line-height:1.4;
    min-width:18px; text-align:center; display:inline-block;
  }

  .toolbar{
    background:var(--bordeaux);
    padding:14px 20px 20px 20px;
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
    justify-content:space-between;
  }
  .toolbar h1{ color:white; font-size:24px; margin:0 12px 0 0; font-weight:800; }
  .toolbar-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; flex:1;}
  .search-box{
    position:relative; flex:1; min-width:180px; max-width:420px;
  }
  .search-box input{
    width:100%; padding:10px 14px 10px 34px; border-radius:10px; border:none;
    background:rgba(255,255,255,.22); color:white; font-size:14px;
  }
  .search-box input::placeholder{ color:rgba(255,255,255,.75); }
  .search-box svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.8; }
  select.pill, .btn{
    padding:10px 14px; border-radius:10px; border:none; font-size:14px; font-weight:700;
    cursor:pointer;
  }
  select.pill{ background:rgba(255,255,255,.22); color:white; }
  select.pill option{ color:#111; }
  .btn-primary{ background:white; color:var(--bordeaux); display:flex; align-items:center; gap:6px;}
  .btn-primary:hover{ background:#f2eaf0; }

  /* le bouton Réserver / Ajouter reste toujours visible en haut à droite, même en défilant */
  #btnReserver, #btnAjouterMat{
    position:fixed;
    top:100px;
    right:20px;
    z-index:45;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
  }

  .btn-filter{
    display:flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:10px; border:none;
    background:white; color:var(--bordeaux); font-size:14px; font-weight:700;
    cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.08);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn-filter:hover{ background:#f2eaf0; transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.15); }
  .btn-filter:active{ transform:translateY(0); }
  .btn-filter .badge{
    font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 6.5px; margin-left:-2px;
  }
  .btn-filter .chev-down{ opacity:.6; margin-left:-2px; }

  .retour-list{ background:white; }
  .retour-row{
    display:flex; align-items:center; gap:14px; padding:12px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .retour-row:hover{ background:var(--mist); }
  .check-circle{
    width:22px; height:22px; border-radius:50%; border:2px solid var(--bordeaux-tint);
    background:white; flex-shrink:0; cursor:pointer; padding:0; transition:background .12s ease, border-color .12s ease, transform .1s ease;
  }
  .check-circle:hover{ background:#f2eaf0; border-color:var(--bordeaux); transform:scale(1.08); }
  .rr-client{ font-weight:700; font-size:14px; }
  .rr-sub{ font-size:12.5px; color:#8a8189; margin-top:2px; }

  main{ flex:1; padding:22px 24px 60px 24px; max-width:1180px; width:100%; margin:0 auto; }

  .ongoing-block{
    margin-bottom:22px; border-radius:16px;
    border:1.5px solid #2b6cb0; background:#bcd7f5;
  }
  .ongoing-toggle{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:14px 18px; background:#2b6cb0; color:white;
    border:none; cursor:pointer; font-size:14px; font-weight:800; text-align:left;
    position:sticky; top:0; z-index:25; border-radius:14px 14px 0 0;
  }
  .ongoing-toggle:hover{ background:#1e4e82; }
  .ongoing-toggle-action{ font-size:14px; font-weight:800; opacity:.9; white-space:nowrap; }
  .ongoing-block .week-group{ background:white; border-color:#93c5fd; }
  .ongoing-block .week-group:nth-child(odd){ background:#a9c9ee; border-color:transparent; }
  .ongoing-block .week-title{ border-color:#93c5fd; color:#1e4e82; }

  .week-group{
    margin-bottom:18px; padding:18px; border-radius:16px;
    background:white; border:1.5px solid var(--bordeaux-tint);
  }
  .week-group:nth-child(odd){
    background: #f4eaf1; border-color:transparent;
  }
  .week-title{
    font-weight:800; font-size:14.5px; color:var(--bordeaux); margin-bottom:16px;
    display:inline-flex; align-items:center; gap:8px;
    background:white; border:1.5px solid var(--bordeaux-tint);
    padding:7px 14px; border-radius:999px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .week-title .arrow{ color:var(--bordeaux-light); }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:16px;
  }
  .card{
    background:var(--mist); border-radius:14px; padding:12px; cursor:pointer;
    border:1.5px solid var(--bordeaux-tint); transition:transform .12s ease, border-color .12s ease;
    min-width:0;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--bordeaux); }
  .card .icon-wrap{
    width:100%; aspect-ratio:1; border-radius:12px; overflow:hidden; margin-bottom:10px;
    background:#111; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .count-badge{
    position:absolute; top:6px; right:6px;
    background:rgba(0,0,0,.65); color:white; font-size:10.5px; font-weight:800;
    padding:2px 6.5px; border-radius:999px; line-height:1.3;
  }
  .card .icon-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .holder-badge{
    width:100%; max-width:100%; margin-top:5px; font-size:10.5px; font-weight:700; color:#1e4e82;
    line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card .code{ font-size:11px; font-weight:800; color:var(--bordeaux); text-transform:uppercase; letter-spacing:.3px;}
  .card .name{ font-size:13.5px; font-weight:700; line-height:1.25; margin:2px 0; }
  .card .place{ font-size:12px; color:#8a8189; }
  .card.overdue{ border-color:var(--warn); background:#f3bdb5; }
  .card.panne{ border-color:#c77a08; background:#f9deae; }
  .card.non-revenu{ border-color:#c77a08; background:#f9deae; }
  .card.chez-client{ border-color:#2b6cb0; background:#bcd7f5; }
  .panne-flag{ margin-top:6px; font-size:10.5px; font-weight:800; color:#a5690f; line-height:1.2; }

  .cat-block{ margin-bottom:32px; }
  .cat-title{ font-weight:800; font-size:15px; margin-bottom:14px; color:var(--ink); }

  .empty-state{
    text-align:center; padding:70px 20px; color:#8a8189;
  }
  .empty-state svg{ opacity:.35; margin-bottom:14px; }
  .empty-state h3{ color:var(--ink); font-size:17px; margin:0 0 6px 0; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,15,25,.45); display:none;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; overflow-x:hidden; z-index:50;
    backdrop-filter: blur(2px);
  }
  .overlay.show{ display:flex; }
  .modal{
    background:white; border-radius:18px; width:100%; max-width:480px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.3); animation:pop .16s ease;
  }
  @keyframes pop{ from{ transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;} }
  .modal-head{
    background:var(--bordeaux); color:white; padding:18px 20px; display:flex; align-items:center; gap:14px;
  }
  .modal-head .icon-wrap{ width:52px;height:52px;border-radius:10px; overflow:hidden; background:#111; flex-shrink:0;}
  .modal-head .icon-wrap img{ width:100%;height:100%;object-fit:cover;}
  .modal-head .title{ font-weight:800; font-size:18px; }
  .modal-head .sub{ font-size:12px; opacity:.85; }
  .modal-body{ padding:20px; max-height:65vh; overflow-y:auto; overflow-x:hidden; }
  .field{ margin-bottom:16px; min-width:0; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:#6b6270; margin-bottom:6px; text-transform:uppercase; letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    width:100%; max-width:100%; min-width:0; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
    font-size:14px; background:var(--mist); font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--bordeaux-light); }
  .two-col{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;}
  .modal-foot{ padding:16px 20px; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--line); }
  .btn-danger.confirming{ background:var(--warn); color:white; }
  .btn-ghost{ background:var(--mist); color:var(--ink); }
  .btn-danger{ background:#fdecea; color:var(--warn); }
  .btn-solid{ background:var(--bordeaux); color:white; }
  .btn-solid:hover{ background:var(--bordeaux-dark); }
  .close-x{ margin-left:auto; background:rgba(255,255,255,.15); border:none; color:white; width:30px;height:30px; border-radius:8px; cursor:pointer; font-size:16px;}

  .res-mini{
    display:flex; align-items:center; gap:12px; background:var(--mist); border-radius:12px; padding:10px 12px; margin-bottom:8px;
    cursor:pointer;
  }
  .res-mini:hover{ background:#efe8ec; }
  .res-mini img{ width:38px;height:38px;border-radius:8px;object-fit:cover; background:#111;}
  .res-mini .rm-name{ font-weight:700; font-size:13.5px; }
  .res-mini .rm-date{ font-size:12px; color:#8a8189; }
  .res-mini .chev{ margin-left:auto; color:#c7bfc7; }

  .materiel-picker-btn{
    width:100%; text-align:left; padding:11px 12px; border-radius:10px;
    border:1.5px solid var(--line); background:var(--mist); font-size:14px;
    font-family:inherit; cursor:pointer; color:var(--ink);
  }
  .materiel-picker-btn:disabled{ opacity:.55; cursor:not-allowed; }
  .materiel-picker-list{
    margin-top:8px; max-height:260px; overflow-y:auto;
    border:1.5px solid var(--line); border-radius:10px; background:white;
  }
  .materiel-picker-cat{
    font-size:11px; font-weight:800; color:#8a8189; padding:9px 12px 4px 12px;
    text-transform:uppercase; letter-spacing:.3px;
  }
  .materiel-picker-item{ display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; }
  .materiel-picker-item:hover{ background:var(--mist); }
  .materiel-picker-item img{ width:32px; height:32px; border-radius:7px; object-fit:cover; background:#111; flex-shrink:0; }

  .conflict-tag{
    display:inline-flex; align-items:center; gap:5px; background:#fdecea; color:var(--warn);
    font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; margin-bottom:14px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:white; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, bottom .2s ease;
  }
  .toast.show{ opacity:1; bottom:34px; }

  footer.statusbar{ height:26px; background:var(--cyan); flex-shrink:0; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#d8cfd6; border-radius:6px; }

  @media(max-width:640px){
    header.topbar{ padding:12px 14px; }
    .topbar-logo{ display:none; }
    .brand{ font-size:17px; padding-bottom:0; }

    /* pied de modale : les boutons passent sur deux lignes plutôt que de déborder */
    .modal-foot{
      flex-wrap:wrap;
      row-gap:12px;
    }
    .modal-foot .btn{
      flex:1 1 calc(50% - 5px);
      min-width:0;
      text-align:center;
      justify-content:center;
    }

    /* barre d'onglets fixée en bas de l'écran, façon app native */
    nav.tabs{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      display:flex; flex-wrap:nowrap; gap:0; justify-content:space-around;
      background:var(--bordeaux-dark);
      padding:10px 4px calc(10px + env(safe-area-inset-bottom)) 4px;
      box-shadow:0 -4px 14px rgba(0,0,0,.2);
      overflow-x:visible;
    }
    nav.tabs button{
      flex:1; flex-shrink:1; flex-direction:column; gap:4px;
      padding:9px 2px; font-size:10.5px; white-space:nowrap;
      border-radius:10px; color:rgba(255,255,255,.7);
    }
    nav.tabs button.active{
      background:rgba(255,255,255,.14); color:white;
    }
    nav.tabs .tab-icon{ display:block; font-size:21px; line-height:1; }
    nav.tabs .badge{ position:absolute; margin-left:18px; margin-top:-19px; font-size:11px; min-width:16px; padding:1.5px 6px; }

    footer.statusbar{ display:none; }

    .toolbar{
      padding:12px 14px 16px 14px;
      flex-direction:column; align-items:stretch; gap:10px;
    }
    .toolbar h1{ font-size:19px; margin:0; }
    .toolbar-row{ flex-wrap:nowrap; width:100%; }
    .search-box{ max-width:none; min-width:0; }
    .btn-filter{ flex-shrink:0; padding:10px 12px; }
    .btn-filter span{ display:none; }
    #btnReserver, #btnAjouterMat{
      top:calc(58px + env(safe-area-inset-top));
      right:14px;
    }

    main{ padding:14px 14px calc(100px + env(safe-area-inset-bottom)) 14px; }
    .grid{ grid-template-columns:repeat(3, 1fr); gap:8px; }
    .card{ padding:9px; border-radius:12px; }
    .card .icon-wrap{ margin-bottom:7px; border-radius:9px; }
    .card .name{ font-size:12.5px; }
    .card .code{ font-size:10px; }
    .card .place{ font-size:11px; }

    .week-title{ font-size:14px; margin-bottom:10px; }
    .cat-title{ font-size:14px; }

    .overlay{ padding:0; align-items:flex-end; }
    .modal{ max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:92vh; display:flex; flex-direction:column; }
    .modal-body{ max-height:none; flex:1; }
    .modal-head{ padding:16px; }
    .two-col{ grid-template-columns:minmax(0,1fr); }

    .res-mini{ padding:9px 10px; }
    .retour-row{ padding:11px 2px; gap:11px; }

    .toast{ left:14px; right:14px; transform:none; bottom:calc(94px + env(safe-area-inset-bottom)); text-align:center; }
    .toast.show{ bottom:calc(104px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <div class="sticky-head">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">MAD Segré / CHT</div>
        <nav class="tabs" id="tabs"></nav>
      </div>
      <div class="topbar-logo"><img src="/logo.png" alt="Logo MAD Segré/CHT"/></div>
    </header>
    <div class="toolbar" id="toolbar"></div>
  </div>
  <main id="main"></main>
</div>
<footer class="statusbar"></footer>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  const TODAY = todayStr(); // vraie date du jour (recalculée à chaque chargement)

  const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function fmtDate(iso){
    if(!iso) return "";
    const d = new Date(iso+"T00:00:00");
    return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`;
  }
  function fmtDateTimeCreation(iso){
    if(!iso) return "";
    const d = new Date(iso);
    if(isNaN(d)) return "";
    const heure = String(d.getHours()).padStart(2,'0');
    const min = String(d.getMinutes()).padStart(2,'0');
    return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()} à ${heure}:${min}`;
  }
  function fmtShort(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  // ---- state ----
  let reservations = [];
  let materiels = [];
  let nextId = 100000;
  let dataReady = false;

  // identifiant vraiment unique (horodatage + composant aléatoire), pour éviter
  // toute collision entre deux appareils qui créeraient chacun un élément au même moment
  function uniqueId(prefix){
    return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  }

  function freshBaseData(){
    const res = RESERVATIONS_JSON.map(r => ({
      ...r,
      rendu: !!r.retour,
    }));
    const mat = MATERIELS_JSON.map(m => ({...m}));
    return {res, mat};
  }

  async function persistReservations(){
    try{
      const r = await fetch('/api/reservations', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(reservations)
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
    }catch(e){
      console.error("Erreur de sauvegarde (réservations):", e);
      toast("⚠ Échec de la sauvegarde — vérifie le lien D1 dans les réglages Cloudflare.");
    }
  }
  async function persistMateriels(){
    try{
      const r = await fetch('/api/materiels', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(materiels)
      });
      if(!r.ok) throw new Error('HTTP '+r.status);
    }catch(e){
      console.error("Erreur de sauvegarde (matériels):", e);
      toast("⚠ Échec de la sauvegarde — vérifie le lien D1 dans les réglages Cloudflare.");
    }
  }

  async function loadData(){
    const {res: baseRes, mat: baseMat} = freshBaseData();
    let storedRes = null, storedMat = null;
    // on ne réamorce (et donc on ne réécrit la base) que si le fetch a RÉUSSI et confirmé
    // qu'il n'y avait vraiment rien -> jamais en cas d'échec réseau/serveur passager,
    // pour ne jamais effacer des données réelles (ex: retours cochés) suite à un simple aléa
    let resFetchOk = false, matFetchOk = false;
    try{
      const r = await fetch('/api/reservations', {cache:'no-store'});
      if(r.ok){ resFetchOk = true; const data = await r.json(); if(data) storedRes = data; }
    }catch(e){ console.error("Lecture réservations impossible (réseau) :", e); }
    try{
      const m = await fetch('/api/materiels', {cache:'no-store'});
      if(m.ok){ matFetchOk = true; const data = await m.json(); if(data) storedMat = data; }
    }catch(e){ console.error("Lecture matériels impossible (réseau) :", e); }

    reservations = storedRes || baseRes;
    materiels = storedMat || baseMat;

    if(!resFetchOk || !matFetchOk){
      toast("⚠ Connexion à la base impossible — données affichées peut-être non à jour.");
    }

    let categorieCorrigee = false;
    reservations.forEach(r=>{
      const mat = materiels.find(m => m.nom.trim().toLowerCase() === (r.materiel||'').trim().toLowerCase());
      if(mat && mat.categorie !== r.categorie){
        r.categorie = mat.categorie;
        categorieCorrigee = true;
      }
    });

    // on ne (re)sème la base que si le fetch a confirmé qu'elle était vraiment vide
    if(!storedRes && resFetchOk) persistReservations();
    if(!storedMat && matFetchOk) persistMateriels();
    if(storedRes && resFetchOk && categorieCorrigee) persistReservations();
  }

  // marque une réservation comme rendue directement côté serveur (via /api/mark-rendu)
  // pour éviter qu'un appareil resté ouvert avec des données périmées n'écrase
  // les coches faites entre-temps par quelqu'un d'autre
  async function markRenduOnServer(id, rendu){
    try{
      const res = await fetch('/api/mark-rendu', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ id, rendu })
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(data && data.ok && data.reservations) return data.reservations;
    }catch(e){
      console.error("Erreur marquage rendu:", e);
      toast("⚠ Échec de la synchronisation du retour — vérifie ta connexion et réessaie.");
    }
    return null;
  }

  // applique une opération (créer/modifier/supprimer une réservation, ou renommer
  // un matériel sur toutes ses réservations) directement côté serveur
  async function reservationOp(op, id, patch, item){
    try{
      const res = await fetch('/api/reservation-op', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ op, id, patch, item })
      });
      const data = await res.json().catch(()=>null);
      if(!res.ok){
        toast(data && data.error ? `⚠ ${data.error}` : "⚠ Échec de l'enregistrement.");
        return null;
      }
      if(data && data.ok && data.reservations) return data.reservations;
    }catch(e){
      console.error("Erreur opération réservation:", e);
      toast("⚠ Échec de l'enregistrement — vérifie ta connexion et réessaie.");
    }
    return null;
  }

  // applique une opération (créer/modifier un matériel) directement côté serveur
  async function materielOp(op, id, patch, item){
    try{
      const res = await fetch('/api/materiel-op', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ op, id, patch, item })
      });
      const data = await res.json().catch(()=>null);
      if(!res.ok){
        toast(data && data.error ? `⚠ ${data.error}` : "⚠ Échec de l'enregistrement.");
        return null;
      }
      if(data && data.ok && data.materiels) return data.materiels;
    }catch(e){
      console.error("Erreur opération matériel:", e);
      toast("⚠ Échec de l'enregistrement — vérifie ta connexion et réessaie.");
    }
    return null;
  }

  // relit les données côté serveur (D1), sans perturber une saisie en cours (modale ouverte)
  async function refreshDataFromServer(){
    if(overlay.classList.contains('show')) return;
    try{
      const [rRes, rMat] = await Promise.all([
        fetch('/api/reservations', {cache:'no-store'}),
        fetch('/api/materiels', {cache:'no-store'})
      ]);
      if(rRes.ok){ const data = await rRes.json(); if(data) reservations = data; }
      if(rMat.ok){ const data = await rMat.json(); if(data) materiels = data; }
      render();
    }catch(e){
      console.error("Rafraîchissement automatique impossible:", e);
    }
  }

  let state = {
    tab: 'reservations',
    search: '',
    filters: { categorie:'', materiel:'', magasin:'' },
    selectedMaterielId: null,
    ongoingCollapsed: true,
  };

  function activeFilterCount(){
    return Object.values(state.filters).filter(Boolean).length;
  }

  const CAT_ORDER = [
    "1. Camion Frigo","2. Buvette Mastertent 4x4","3. Buvette Mastertent 3x3",
    "4. Buvette pliable 6x3","5. Tirage nomade 2 becs","6. Tirage à poser 1 bec","7. Tirage à poser 2 becs",
    "8. Tirage froid sec 1 bec","9. Tirage froid sec 2 becs","10. Tirage Sablé","11. Autres matériels",
    "13. Perfect Draft","14. Buvette Tubulaire","Chez le client - Tirage fixe"
  ];

  function materielByName(nom){
    return materiels.find(m => m.nom.trim().toLowerCase() === (nom||'').trim().toLowerCase());
  }

  function materielNumber(nom){
    const m = (nom||'').trim().match(/(\d+)\s*$/);
    return m ? parseInt(m[1],10) : Infinity;
  }
  function catIndex(cat){
    const i = CAT_ORDER.indexOf(cat);
    return i===-1 ? 999 : i;
  }
  // trie par catégorie (ordre du référentiel) puis par n° de matériel croissant
  function sortByCategoryThenNumber(list){
    return list.slice().sort((a,b)=>{
      const ci = catIndex(a.categorie) - catIndex(b.categorie);
      if(ci !== 0) return ci;
      const ni = materielNumber(a.materiel) - materielNumber(b.materiel);
      if(ni !== 0) return ni;
      return (a.materiel||'').localeCompare(b.materiel||'');
    });
  }

  function isPast(fin){ return fin && fin <= TODAY; }
  function isPending(r){ return r.fin && r.fin <= TODAY && !r.rendu; }

  // deux périodes se chevauchent si l'une commence avant que l'autre finisse (bornes incluses)
  function isOverlapping(aStart,aEnd,bStart,bEnd){
    return aStart <= bEnd && bStart <= aEnd;
  }

  // renvoie la réservation en conflit pour ce matériel sur cette période, ou null
  function findConflict(materielNom, debut, fin, excludeId){
    return reservations.find(r =>
      r.id !== excludeId &&
      r.materiel.trim().toLowerCase() === (materielNom||'').trim().toLowerCase() &&
      r.debut && r.fin &&
      isOverlapping(debut, fin, r.debut, r.fin)
    ) || null;
  }

  // catégories non proposables à la réservation (matériel géré directement chez le client)
  const CATEGORIES_NON_RESERVABLES = new Set(["Chez le client - Tirage fixe"]);

  // client qui a actuellement ce matériel (réservation en cours ou en retard, non rendue)
  function currentHolderFor(materielNom){
    return reservations.find(r =>
      r.materiel.trim().toLowerCase() === (materielNom||'').trim().toLowerCase() &&
      r.debut && r.debut <= TODAY &&
      !r.rendu
    ) || null;
  }

  // liste des matériels sans conflit sur la période donnée (hors catégories non réservables et matériel en panne)
  // nombre de réservations de ce matériel dont le début est dans l'année en cours
  function countReservationsThisYear(materielNom){
    const yearStart = TODAY.slice(0,4) + "-01-01";
    return reservations.filter(r =>
      r.materiel.trim().toLowerCase() === (materielNom||'').trim().toLowerCase() &&
      r.debut && r.debut >= yearStart
    ).length;
  }

  // vrai si ce matériel a une réservation passée pas encore cochée "rendu"
  // (excludeReservationId permet d'ignorer la réservation elle-même, ex: sur sa propre carte)
  function hasPendingReturn(materielNom, excludeReservationId){
    return reservations.some(r =>
      (excludeReservationId ? r.id !== excludeReservationId : true) &&
      r.materiel.trim().toLowerCase() === (materielNom||'').trim().toLowerCase() &&
      isPending(r)
    );
  }

  function availableMateriels(debut, fin, excludeId){
    if(!debut || !fin) return [];
    return materiels
      .filter(m => !CATEGORIES_NON_RESERVABLES.has(m.categorie))
      .filter(m => m.lieu !== "En panne")
      .filter(m => !hasPendingReturn(m.nom))
      .filter(m => !findConflict(m.nom, debut, fin, excludeId));
  }

  // ---- rendering ----
  const tabsEl = document.getElementById('tabs');
  const toolbarEl = document.getElementById('toolbar');
  const mainEl = document.getElementById('main');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');
  const toastEl = document.getElementById('toast');

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 2200);
  }

  function closeModal(){ overlay.classList.remove('show'); modal.innerHTML=''; }
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

  const TAB_DEFS = [
    {id:'reservations', label:'Réservations', icon:'📄'},
    {id:'materiels', label:'Matériels', icon:'▦'},
    {id:'retour', label:'Retour', icon:'⊞'},
    {id:'archives', label:'Archives', icon:'🗂'},
  ];

  function renderTabs(){
    const pendingCount = reservations.filter(isPending).length;
    tabsEl.innerHTML = TAB_DEFS.map(t => `
      <button data-tab="${t.id}" class="${state.tab===t.id?'active':''}">
        <span class="tab-icon">${t.icon}</span>
        <span class="tab-label">${t.label}</span>
        ${t.id==='retour' && pendingCount>0 ? `<span class="badge">${pendingCount}</span>` : ''}
      </button>
    `).join('');
    tabsEl.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        state.tab=b.dataset.tab; state.selectedMaterielId=null;
        if(b.dataset.tab==='reservations') state.ongoingCollapsed = true;
        render();
      });
    });
  }

  function renderToolbar(){
    const titles = {reservations:'Réservations', materiels:'Matériels', retour:'Retour', archives:'Archives'};
    let extra = '';
    if(state.tab==='reservations' || state.tab==='archives'){
      const n = activeFilterCount();
      extra = `
        <div class="toolbar-row">
          <div class="search-box">
            <svg width="16" height="16" fill="none" stroke="white" stroke-width="2"><circle cx="7" cy="7" r="5.2"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
            <input id="searchInput" placeholder="Rechercher un client..." value="${state.search.replace(/"/g,'&quot;')}"/>
          </div>
          <button class="btn-filter" id="filterBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span>Filtrer</span>
            ${n>0 ? `<span class="badge" style="background:var(--bordeaux);color:white;">${n}</span>` : ''}
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="chev-down"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>`;
    }
    if(state.tab==='materiels'){
      extra = `<div class="toolbar-row"></div>`;
    }
    if(state.tab==='retour'){
      extra = `
        <div class="toolbar-row">
          <div class="search-box">
            <svg width="16" height="16" fill="none" stroke="white" stroke-width="2"><circle cx="7" cy="7" r="5.2"/><line x1="11" y1="11" x2="15" y2="15"/></svg>
            <input id="searchInput" placeholder="Rechercher..." value="${state.search.replace(/"/g,'&quot;')}"/>
          </div>
        </div>`;
    }
    toolbarEl.innerHTML = `
      <h1>${titles[state.tab]}</h1>
      ${extra}
      ${state.tab==='reservations' ? `<button class="btn btn-primary" id="btnReserver">✎ Réserver</button>` : ''}
      ${state.tab==='materiels' ? `<button class="btn btn-primary" id="btnAjouterMat">+ Ajouter</button>` : ''}
    `;
    const s = document.getElementById('searchInput');
    if(s){ s.addEventListener('input', (e)=>{ state.search = e.target.value; renderMain(); }); }
    const fb = document.getElementById('filterBtn');
    if(fb){ fb.addEventListener('click', ()=> openFilterPanel()); }
    const br = document.getElementById('btnReserver');
    if(br){ br.addEventListener('click', ()=> openReservationForm()); }
    const bam = document.getElementById('btnAjouterMat');
    if(bam){ bam.addEventListener('click', ()=> openMaterielCreateForm()); }
  }

  // ---- panneau de filtres (Catégorie / Matériel / Magasin / Client) ----
  const FILTER_TYPES = [
    {key:'categorie', label:'Catégorie'},
    {key:'materiel',  label:'Matériel'},
    {key:'magasin',   label:'Magasin'},
  ];

  function filterOptionsFor(key){
    if(key==='categorie'){
      const present = new Set(reservations.map(r=>r.categorie));
      return CAT_ORDER.filter(c=>present.has(c));
    }
    if(key==='materiel') return materiels.map(m=>m.nom).sort((a,b)=>a.localeCompare(b,'fr'));
    if(key==='magasin') return ['Segré','CHT','Sablé'];
    if(key==='client') return [...new Set(reservations.map(r=>r.client))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
    return [];
  }

  function openFilterPanel(sub){
    if(!sub){
      modal.innerHTML = `
        <div class="modal-head">
          <div class="title">Filtrer</div>
          <button class="close-x" id="closeX">✕</button>
        </div>
        <div class="modal-body">
          ${FILTER_TYPES.map(t=>`
            <div class="res-mini" data-open="${t.key}">
              <div>
                <div class="rm-name">${t.label}</div>
                ${state.filters[t.key] ? `<div class="rm-date">${state.filters[t.key]}</div>` : ''}
              </div>
              <span class="chev">›</span>
            </div>`).join('')}
        </div>
        <div class="modal-foot">
          <button class="btn btn-ghost" id="clearAllBtn">Tout effacer</button>
          <button class="btn btn-solid" id="doneBtn">Terminé</button>
        </div>
      `;
      overlay.classList.add('show');
      document.getElementById('closeX').addEventListener('click', closeModal);
      document.getElementById('doneBtn').addEventListener('click', ()=>{ closeModal(); renderMain(); renderToolbar(); });
      document.getElementById('clearAllBtn').addEventListener('click', ()=>{
        state.filters = { categorie:'', materiel:'', magasin:'' };
        openFilterPanel();
      });
      modal.querySelectorAll('[data-open]').forEach(el=>{
        el.addEventListener('click', ()=> openFilterPanel(el.dataset.open));
      });
    } else {
      const label = FILTER_TYPES.find(t=>t.key===sub).label;
      const options = filterOptionsFor(sub);
      modal.innerHTML = `
        <div class="modal-head">
          <button class="close-x" id="backBtn">←</button>
          <div class="title">${label}</div>
          <button class="close-x" id="closeX">✕</button>
        </div>
        <div class="modal-body">
          <div class="res-mini" data-val="">
            <div class="rm-name">Tous</div>
            ${!state.filters[sub] ? `<span style="margin-left:auto;color:var(--bordeaux);font-weight:800;">✓</span>` : ''}
          </div>
          ${options.map(opt=>`
            <div class="res-mini" data-val="${opt.replace(/"/g,'&quot;')}">
              <div class="rm-name">${opt}</div>
              ${state.filters[sub]===opt ? `<span style="margin-left:auto;color:var(--bordeaux);font-weight:800;">✓</span>` : ''}
            </div>`).join('')}
        </div>
      `;
      document.getElementById('closeX').addEventListener('click', closeModal);
      document.getElementById('backBtn').addEventListener('click', ()=> openFilterPanel());
      modal.querySelectorAll('[data-val]').forEach(el=>{
        el.addEventListener('click', ()=>{
          state.filters[sub] = el.dataset.val;
          openFilterPanel();
        });
      });
    }
  }

  function cardHtml(r){
    const overdue = isPending(r);
    const mat = materielByName(r.materiel);
    const panne = !!(mat && mat.lieu === "En panne");
    const nonRevenu = !panne && hasPendingReturn(r.materiel, r.id);
    return `
      <div class="card ${overdue?'overdue':''} ${panne?'panne':''} ${nonRevenu?'non-revenu':''}" data-id="${r.id}" data-kind="res">
        <div class="icon-wrap">${r.icone ? `<img src="${r.icone}" loading="lazy"/>` : ''}</div>
        <div class="code">${r.materiel}</div>
        <div class="name">${r.client}</div>
        <div class="place">${r.magasin}</div>
        ${panne ? `<div class="panne-flag">⚠ Matériel en panne</div>` : ''}
        ${nonRevenu ? `<div class="panne-flag" style="color:#a5690f;">⏳ Matériel non revenu</div>` : ''}
      </div>`;
  }

  function resRowHtml(r){
    return `
      <div class="res-mini" data-id="${r.id}">
        <img src="${r.icone||''}"/>
        <div>
          <div class="rm-name">${r.materiel} <span style="color:#8a8189;font-weight:500;">· ${r.magasin}</span></div>
          <div class="rm-date">${fmtDate(r.debut)} → ${fmtDate(r.fin)}</div>
        </div>
        <span class="chev">›</span>
      </div>`;
  }

  // ligne d'archive : client en avant, date complète + matériel toujours visibles
  function archiveRowHtml(r){
    return `
      <div class="res-mini" data-id="${r.id}">
        <img src="${r.icone||''}"/>
        <div>
          <div class="rm-name">${r.client}</div>
          <div class="rm-date">${fmtDate(r.debut)} → ${fmtDate(r.fin)} · ${r.materiel}</div>
        </div>
        <span class="chev">›</span>
      </div>`;
  }

  // regroupe une liste de réservations par client (tri alpha), et par date à l'intérieur
  function groupByClientHtml(list){
    const groups = {};
    list.forEach(r=> (groups[r.client||'—'] = groups[r.client||'—']||[]).push(r));
    const names = Object.keys(groups).sort((a,b)=> a.localeCompare(b,'fr'));
    return names.map(client=>{
      const items = groups[client].sort((a,b)=> (a.debut||'').localeCompare(b.debut||''));
      return `<div class="week-group">
        <div class="week-title">${client} <span style="font-weight:600;color:#8a8189;font-size:13px;">(${items.length})</span></div>
        ${items.map(resRowHtml).join('')}
      </div>`;
    }).join('');
  }

  function bindRows(){
    mainEl.querySelectorAll('.res-mini[data-id]').forEach(el=>{
      el.addEventListener('click', ()=> openReservationDetail(el.dataset.id));
    });
  }

  function filteredReservations(list){
    return list.filter(r=>{
      const f = state.filters;
      if(f.categorie && r.categorie !== f.categorie) return false;
      if(f.materiel && r.materiel !== f.materiel) return false;
      if(f.magasin && r.magasin !== f.magasin) return false;
      if(state.search && !r.client.toLowerCase().includes(state.search.toLowerCase()) && !r.materiel.toLowerCase().includes(state.search.toLowerCase())) return false;
      return true;
    });
  }

  function renderReservationsTab(){
    const upcomingAll = filteredReservations(reservations.filter(r=> !isPast(r.fin)));
    if(upcomingAll.length===0){
      mainEl.innerHTML = emptyState("Aucune réservation à venir", "Crée une nouvelle réservation avec le bouton « Réserver ».");
      return;
    }

    // réservations "en cours" : leur période a commencé strictement avant aujourd'hui (à partir de J+1)
    const ongoing = upcomingAll.filter(r=> r.debut && r.debut < TODAY);
    const rest = upcomingAll.filter(r=> !(r.debut && r.debut < TODAY));

    let html = '';

    if(ongoing.length > 0){
      const ongoingGroups = {};
      ongoing.forEach(r=>{
        const key = r.debut+'|'+r.fin;
        (ongoingGroups[key] = ongoingGroups[key]||[]).push(r);
      });
      const ongoingKeys = Object.keys(ongoingGroups).sort();
      const ongoingContent = ongoingKeys.map(key=>{
        const [debut,fin] = key.split('|');
        const items = sortByCategoryThenNumber(ongoingGroups[key]);
        return `<div class="week-group">
          <div class="week-title">${fmtDate(debut)} <span class="arrow">→</span> ${fmtDate(fin)}</div>
          <div class="grid">${items.map(cardHtml).join('')}</div>
        </div>`;
      }).join('');
      html += `
        <div class="ongoing-block">
          <button class="ongoing-toggle" id="ongoingToggle">
            <span class="ongoing-toggle-text">📌 ${ongoing.length} réservation${ongoing.length>1?'s':''} en cours aujourd'hui</span>
            <span class="ongoing-toggle-action">${state.ongoingCollapsed ? 'Afficher ▾' : 'Réduire ▴'}</span>
          </button>
          <div id="ongoingGrid" style="${state.ongoingCollapsed ? 'display:none;' : ''} padding-top:14px;">
            ${ongoingContent}
          </div>
        </div>`;
    }

    if(rest.length > 0){
      const groups = {};
      rest.forEach(r=>{
        const key = r.debut+'|'+r.fin;
        (groups[key] = groups[key]||[]).push(r);
      });
      const keys = Object.keys(groups).sort();
      html += keys.map(key=>{
        const [debut,fin] = key.split('|');
        const items = sortByCategoryThenNumber(groups[key]);
        return `<div class="week-group">
          <div class="week-title">${fmtDate(debut)} <span class="arrow">→</span> ${fmtDate(fin)}</div>
          <div class="grid">${items.map(cardHtml).join('')}</div>
        </div>`;
      }).join('');
    } else if(ongoing.length > 0){
      html += `<div style="color:#8a8189; padding:20px 4px;">Aucune autre réservation à venir pour l'instant.</div>`;
    }

    mainEl.innerHTML = html;
    bindCards();

    const toggleBtn = document.getElementById('ongoingToggle');
    if(toggleBtn){
      toggleBtn.addEventListener('click', ()=>{
        state.ongoingCollapsed = !state.ongoingCollapsed;
        renderReservationsTab();
      });
    }
  }

  function renderArchivesTab(){
    const past = filteredReservations(reservations.filter(r=> r.rendu === true));
    if(past.length===0){
      mainEl.innerHTML = emptyState("Aucune archive", "Les réservations cochées comme rendues apparaîtront ici.");
      return;
    }
    const groups = {};
    past.forEach(r=>{ (groups[r.fin]=groups[r.fin]||[]).push(r); });
    const keys = Object.keys(groups).sort().reverse(); // plus récent en premier
    mainEl.innerHTML = keys.map(fin=>{
      const items = sortByCategoryThenNumber(groups[fin]);
      return `<div class="week-group">
        <div class="week-title">${fmtDate(fin)}</div>
        ${items.map(archiveRowHtml).join('')}
      </div>`;
    }).join('');
    bindRows();
  }

  function retourRowHtml(r){
    return `
      <div class="retour-row" data-id="${r.id}">
        <button class="check-circle" data-check="${r.id}" title="Marquer comme rendu" aria-label="Marquer comme rendu"></button>
        <div class="rr-text">
          <div class="rr-client">${r.client}</div>
          <div class="rr-sub">${r.materiel} ; ${fmtDate(r.debut)} → ${fmtDate(r.fin)}</div>
        </div>
      </div>`;
  }

  function renderRetourTab(){
    const pending = filteredReservations(reservations.filter(isPending));
    if(pending.length===0){
      mainEl.innerHTML = emptyState("Rien à retourner", "Tout le matériel en retard a été rendu. 👍");
      return;
    }
    const groups = {};
    pending.forEach(r=>{ (groups[r.magasin||'—']=groups[r.magasin||'—']||[]).push(r); });
    const magasinOrder = ['Segré','CHT','Sablé'];
    const keys = magasinOrder.filter(k=>groups[k]).concat(Object.keys(groups).filter(k=>!magasinOrder.includes(k)));
    mainEl.innerHTML = keys.map(mag=>{
      const items = sortByCategoryThenNumber(groups[mag]);
      return `<div class="week-group">
        <div class="week-title">${mag}</div>
        <div class="retour-list">${items.map(retourRowHtml).join('')}</div>
      </div>`;
    }).join('');
    mainEl.querySelectorAll('[data-check]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const r = reservations.find(x=>x.id===btn.dataset.check);
        if(r){
          r.rendu = true; renderMain(); renderTabs(); // mise à jour immédiate de l'affichage
          toast(`${r.client} — matériel rendu ✓`);
          markRenduOnServer(r.id, true).then(freshList=>{ if(freshList){ reservations = freshList; } });
        }
      });
    });
    mainEl.querySelectorAll('.retour-row').forEach(row=>{
      row.addEventListener('click', ()=> openReservationDetail(row.dataset.id));
    });
  }

  function renderMateriels(){
    if(state.selectedMaterielId){
      renderMaterielDetail(state.selectedMaterielId);
      return;
    }
    const groups = {};
    materiels.forEach(m=>{ (groups[m.categorie]=groups[m.categorie]||[]).push(m); });
    const order = CAT_ORDER.filter(c=>groups[c]);
    Object.keys(groups).forEach(c=>{ if(!order.includes(c)) order.push(c); });
    mainEl.innerHTML = order.map(cat=>{
      const items = groups[cat];
      return `<div class="cat-block">
        <div class="cat-title">${cat}</div>
        <div class="grid">${items.map(m=>{
          const panne = m.lieu === "En panne";
          const nonRevenu = !panne && hasPendingReturn(m.nom);
          const countYear = countReservationsThisYear(m.nom);
          const holder = currentHolderFor(m.nom);
          const enCours = !panne && !nonRevenu && holder;
          return `
          <div class="card ${panne?'overdue':''} ${nonRevenu?'non-revenu':''} ${enCours?'chez-client':''}" data-id="${m.id}" data-kind="mat">
            <div class="icon-wrap">${m.icone?`<img src="${m.icone}" loading="lazy"/>`:''}${countYear>0?`<span class="count-badge">${countYear}×</span>`:''}</div>
            <div class="name">${m.nom}</div>
            <div class="place">${panne ? m.lieu+' ⚠' : (nonRevenu ? 'Non revenu ⏳' : m.lieu)}</div>
            ${holder ? `<div class="holder-badge">📍 Chez ${holder.client}</div>` : ''}
          </div>`;
        }).join('')}</div>
      </div>`;
    }).join('');
    mainEl.querySelectorAll('[data-kind="mat"]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.selectedMaterielId = el.dataset.id; renderMain(); });
    });
  }

  const LIEUX_MATERIEL = ["Segré","CHT","Sablé","Chez le client","En panne"];

  // liste des catégories existantes, dans l'ordre du référentiel
  function allCategories(){
    const present = new Set(materiels.map(m=>m.categorie));
    const order = CAT_ORDER.filter(c=>present.has(c));
    present.forEach(c=>{ if(!order.includes(c)) order.push(c); });
    return order;
  }

  // lit un fichier image sélectionné, le redimensionne et le compresse en JPEG
  // pour rester léger (stocké directement dans les données de l'appli)
  function compressImageFile(file, maxDim, quality){
    maxDim = maxDim || 900; quality = quality || 0.78;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w >= h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h > w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = ()=> reject(new Error('image invalide'));
        img.src = e.target.result;
      };
      reader.onerror = ()=> reject(new Error('lecture du fichier impossible'));
      reader.readAsDataURL(file);
    });
  }

      });

    let delConfirmTimer = null;
    delBtn.addEventListener('click', async ()=>{
      if(!delBtn.classList.contains('confirming')){
        delBtn.classList.add('confirming');
        delBtn.textContent = 'Confirmer la suppression ?';
        delConfirmTimer = setTimeout(()=>{
          delBtn.classList.remove('confirming');
          delBtn.textContent = 'Supprimer';
        }, 4000);
        return;
      }
      clearTimeout(delConfirmTimer);
      const freshList = await reservationOp('delete', id, null, null);
      if(freshList) reservations = freshList;
      closeModal(); toast("Réservation supprimée."); render();
    });

    const debutInput = document.getElementById('f_debut');
    const finInput = document.getElementById('f_fin');
    const materielBtn = document.getElementById('f_materiel_btn');
    const materielList = document.getElementById('f_materiel_list');
    const availCount = document.getElementById('availCount');
    const conflictBox = document.getElementById('conflictBox');
    let selectedMateriel = r.materiel;

    materielBtn.addEventListener('click', ()=>{
      materielList.style.display = materielList.style.display==='none' ? 'block' : 'none';
    });

    function bindPickerItems(){
      materielList.querySelectorAll('.materiel-picker-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          selectedMateriel = item.dataset.nom;
          materielBtn.textContent = selectedMateriel;
          materielList.style.display = 'none';
          refreshAvailability();
        });
      });
    }

    function refreshAvailability(){
      const debut = debutInput.value, fin = finInput.value;
      conflictBox.innerHTML = '';
      if(!debut || !fin || fin < debut){
        materielBtn.textContent = !debut||!fin ? '— dates manquantes —' : 'fin avant début';
        availCount.textContent = '';
        return;
      }
      // le matériel actuel de cette réservation reste proposé même s'il est "pris" par elle-même
      const avail = availableMateriels(debut, fin, id);
      const currentStillThere = avail.some(m=>m.nom===r.materiel) ? r.materiel : null;
      // s'assurer que le matériel actuel apparaît toujours dans la liste (pour ne pas le perdre visuellement)
      let list = avail;
      if(!currentStillThere){
        const cur = materielByName(r.materiel);
        if(cur) list = [cur, ...avail];
      }
      availCount.textContent = `(${avail.length} disponible${avail.length>1?'s':''} sur ${materiels.length})`;
      materielBtn.textContent = selectedMateriel || r.materiel;
      materielList.innerHTML = materielPickerListHtml(list, selectedMateriel || r.materiel);
      bindPickerItems();
      const conflict = findConflict(selectedMateriel || r.materiel, debut, fin, id);
      if(conflict){
        conflictBox.innerHTML = `<div class="conflict-tag">⚠ Déjà réservé par ${conflict.client} sur cette période</div>`;
      }
    }
    debutInput.addEventListener('change', refreshAvailability);
    finInput.addEventListener('change', refreshAvailability);
    refreshAvailability();

    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      const debut = debutInput.value, fin = finInput.value;
      const materielNom = selectedMateriel || r.materiel;
      if(!debut || !fin || fin < debut){ toast("Vérifie les dates de réservation."); return; }
      const conflict = findConflict(materielNom, debut, fin, id);
      if(conflict){
        toast(`Impossible : déjà réservé par ${conflict.client} sur cette période.`);
        return;
      }
      const matched = materielByName(materielNom);
      const patch = {
        client: document.getElementById('f_client').value.trim() || r.client,
        materiel: materielNom,
        magasin: document.getElementById('f_magasin').value,
        debut, fin,
        commentaire: document.getElementById('f_comment').value,
        icone: matched ? matched.icone : r.icone,
        categorie: matched ? matched.categorie : r.categorie,
      };
      const rd = document.getElementById('f_rendu');
      if(rd) patch.rendu = rd.checked;
      const freshList = await reservationOp('update', id, patch, null);
      if(freshList) reservations = freshList;
      closeModal(); toast("Réservation mise à jour."); render();
    });
  }

  function materielOptionsHtml(list, selected){
    const byCat = {};
    list.forEach(m=>{ (byCat[m.categorie]=byCat[m.categorie]||[]).push(m); });
    const cats = CAT_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CAT_ORDER.includes(c)));
    return cats.map(c => `<optgroup label="${c}">${
      byCat[c].map(m=>`<option value="${m.nom.replace(/"/g,'&quot;')}" ${m.nom===selected?'selected':''}>${m.nom}</option>`).join('')
    }</optgroup>`).join('');
  }

  // un <select> natif ne peut pas afficher d'images dans ses options
  function materielPickerListHtml(list, selected){
    const byCat = {};
    list.forEach(m=>{ (byCat[m.categorie]=byCat[m.categorie]||[]).push(m); });
    const cats = CAT_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CAT_ORDER.includes(c)));
    return cats.map(c => `
      <div class="materiel-picker-cat">${c}</div>
      ${byCat[c].map(m=>`
        <div class="materiel-picker-item" data-nom="${m.nom.replace(/"/g,'&quot;')}">
          <img src="${m.icone||''}"/>
          <span>${m.nom}${(m.lieu==='Segré'||m.lieu==='CHT')?` <span style="color:var(--warn);font-weight:600;">(${m.lieu})</span>`:''}</span>
          ${m.nom===selected?'<span style="margin-left:auto;color:var(--bordeaux);font-weight:800;">✓</span>':''}
        </div>`).join('')}
    `).join('');
  }

      <div class="modal-body">
        <div class="two-col">
          <div class="field"><label>Début réservation</label><input type="date" id="f_debut" value="${prefill.debut||''}"/></div>
          <div class="field"><label>Fin réservation</label><input type="date" id="f_fin" value="${prefill.fin||''}"/></div>
        </div>
        <div class="field">
          <label>Matériel <span id="availCount" style="text-transform:none;font-weight:600;color:#8a8189;"></span></label>
          <button type="button" id="f_materiel_btn" class="materiel-picker-btn" disabled>— Choisis d'abord les dates —</button>
          <div id="f_materiel_list" class="materiel-picker-list" style="display:none;"></div>
        </div>
        <div class="field"><label>Nom client</label><input id="f_client" placeholder="Nom du client ou de l'association" value="${(prefill.client||'').replace(/"/g,'&quot;')}"/></div>
        <div class="field"><label>Magasin</label>
          <select id="f_magasin">
            <option value="">Sélectionner une option</option>
            <option ${prefill.magasin==='Segré'?'selected':''}>Segré</option>
            <option ${prefill.magasin==='CHT'?'selected':''}>CHT</option>
            <option ${prefill.magasin==='Sablé'?'selected':''}>Sablé</option>
          </select>
        </div>
        <div class="field"><label>Commentaire</label><textarea id="f_comment" rows="2">${prefill.commentaire||''}</textarea></div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="cancelBtn">Annuler</button>
        <button class="btn btn-solid" id="saveBtn">Réserver</button>
      </div>
    `;
    overlay.classList.add('show');
    document.getElementById('closeX').addEventListener('click', closeModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);

    const debutInput = document.getElementById('f_debut');
    const finInput = document.getElementById('f_fin');
    const materielBtn = document.getElementById('f_materiel_btn');
    const materielList = document.getElementById('f_materiel_list');
    const availCount = document.getElementById('availCount');
    let selectedMateriel = '';

    materielBtn.addEventListener('click', ()=>{
      if(materielBtn.disabled) return;
      materielList.style.display = materielList.style.display==='none' ? 'block' : 'none';
    });

    function bindPickerItems(){
      materielList.querySelectorAll('.materiel-picker-item').forEach(item=>{
        item.addEventListener('click', ()=>{
          selectedMateriel = item.dataset.nom;
          materielBtn.textContent = selectedMateriel;
          materielList.style.display = 'none';
        });
      });
    }

    function refreshAvailability(){
      const debut = debutInput.value, fin = finInput.value;
      materielList.style.display = 'none';
      if(!debut || !fin){
        materielBtn.disabled = true;
        materielBtn.textContent = "— Choisis d'abord les dates —";
        availCount.textContent = '';
        selectedMateriel = '';
        return;
      }
      if(fin < debut){
        materielBtn.disabled = true;
        materielBtn.textContent = "La date de fin précède le début";
        availCount.textContent = '';
        selectedMateriel = '';
        return;
      }
      const avail = availableMateriels(debut, fin, null);
      const total = materiels.length;
      availCount.textContent = `(${avail.length} disponible${avail.length>1?'s':''} sur ${total})`;
      if(avail.length===0){
        materielBtn.disabled = true;
        materielBtn.textContent = "Aucun matériel disponible sur ces dates";
        selectedMateriel = '';
        return;
      }
      materielBtn.disabled = false;
      const stillAvail = presetMateriel && avail.some(m=>m.nom===presetMateriel);
      if(stillAvail && !selectedMateriel) selectedMateriel = presetMateriel;
      if(selectedMateriel && !avail.some(m=>m.nom===selectedMateriel)) selectedMateriel = '';
      materielBtn.textContent = selectedMateriel || "— Sélectionner —";
      materielList.innerHTML = materielPickerListHtml(avail, selectedMateriel);
      bindPickerItems();
    }

    debutInput.addEventListener('change', refreshAvailability);
    finInput.addEventListener('change', refreshAvailability);

    document.getElementById('saveBtn').addEventListener('click', async ()=>{
      const materielNom = selectedMateriel;
      const client = document.getElementById('f_client').value.trim();
      const magasin = document.getElementById('f_magasin').value;
      const debut = debutInput.value;
      const fin = finInput.value;
      if(!debut || !fin){ toast("Choisis d'abord les dates de réservation."); return; }
      if(fin < debut){ toast("La date de fin doit être après le début."); return; }
      if(!materielNom || !client || !magasin){
        toast("Merci de remplir tous les champs requis.");
        return;
      }
      // garde-fou anti double-réservation (au cas où la liste ait changé entre-temps)
      const conflict = findConflict(materielNom, debut, fin, null);
      if(conflict){
        toast(`Indisponible : déjà réservé par ${conflict.client} sur cette période.`);
        refreshAvailability();
        return;
      }
      const matched = materielByName(materielNom);
      const newItem = {
        id: uniqueId('res'),
        dateCreation: new Date().toISOString(),
        client, materiel: materielNom, magasin, debut, fin,
        categorie: matched?matched.categorie:'',
        icone: matched?matched.icone:'',
        retour:false, rendu:false, conflit:false,
        commentaire: document.getElementById('f_comment').value,
        futs:''
      };
      const freshList = await reservationOp('create', null, null, newItem);
      if(freshList) reservations = freshList;
      closeModal(); toast("Réservation créée ✓"); render();
    });

    if(presetMateriel){
      // pré-sélection possible seulement une fois des dates saisies
    }
    refreshAvailability();
  }

  function renderMain(){
    if(state.tab==='reservations') renderReservationsTab();
    else if(state.tab==='archives') renderArchivesTab();
    else if(state.tab==='retour') renderRetourTab();
    else if(state.tab==='materiels') renderMateriels();
  }

  function render(){
    renderTabs();
    renderToolbar();
    renderMain();
  }

  async function boot(){
    mainEl.innerHTML = `<div class="empty-state"><h3>Chargement…</h3></div>`;
    await loadData();
    dataReady = true;
    render();

    // rafraîchissement automatique : toutes les 2 minutes, et à chaque retour sur l'onglet
    setInterval(refreshDataFromServer, 2*60*1000);
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') refreshDataFromServer();
    });
  }

  boot();
})();

</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('/sw.js').catch(()=>{ /* pas grave si indisponible */ });
    });
  }
</script>
</body>
</html>
