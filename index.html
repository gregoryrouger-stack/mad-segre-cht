// Bouton Filtres : ouvre / ferme le panneau de filtres
// Bouton Contacts : ouvre / ferme le panneau de contacts
(function setupSidePanels(){
  // Ferme tous les panneaux ouverts
  const closeAll = ()=>{
    document.getElementById("ctrlbar")?.classList.remove("open");
    document.getElementById("contactsPanel")?.classList.remove("open");
    document.getElementById("filtersBackdrop")?.classList.remove("open");
    document.getElementById("contactsBackdrop")?.classList.remove("open");
  };
  // Configure un trio (bouton, panneau, voile de fond)
  const setup = (btnId, panelId, backdropId, closeBtnId)=>{
    const btn = document.getElementById(btnId);
    const panel = document.getElementById(panelId);
    const backdrop = document.getElementById(backdropId);
    const closeBtn = document.getElementById(closeBtnId);
    if(!btn || !panel) return;
    btn.onclick = ()=>{
      const wasOpen = panel.classList.contains("open");
      closeAll();
      if(!wasOpen){
        panel.classList.add("open");
        if(backdrop) backdrop.classList.add("open");
      }
    };
    if(closeBtn) closeBtn.onclick = closeAll;
    if(backdrop) backdrop.onclick = closeAll;
  };
  setup("filtersBtn", "ctrlbar", "filtersBackdrop", "ctrlbarClose");
  setup("contactsBtn", "contactsPanel", "contactsBackdrop", "contactsClose");
})();

// ---- import / export Excel ----
function iemsg(txt, kind){
  const m = document.getElementById("iemsg");
  m.textContent = txt;
  m.style.color = kind==="err" ? "var(--ferie)"
    : kind==="ok" ? "var(--cht)" : "var(--muted)";
}
function excelDateToISO(v){
  // v peut être : un nombre série Excel, une date JS, ou une chaîne
  let serial = null;
  if(typeof v === "number"){
    serial = v;
  } else if(v instanceof Date){
    // reconvertir la Date en nombre série en neutralisant le fuseau
    serial = v.getTime()/86400000 + 25569
      + v.getTimezoneOffset()/1440;
  } else if(typeof v === "string"){
    // chaîne du type AAAA-MM-JJ ou JJ/MM/AAAA
    let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[1]+"-"+m[2]+"-"+m[3];
    m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) return m[3]+"-"+String(m[2]).padStart(2,"0")
      +"-"+String(m[1]).padStart(2,"0");
    return null;
  } else return null;
  if(serial===null || isNaN(serial)) return null;
  // conversion du nombre série Excel en date civile, calcul pur (sans fuseau)
  const days = Math.round(serial);
  // base : 1899-12-30 ; on calcule via un Date UTC puis on lit en UTC
  const d = new Date(Date.UTC(1899,11,30) + days*86400000);
  if(isNaN(d.getTime())) return null;
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")
    +"-"+String(d.getUTCDate()).padStart(2,"0");
}

document.getElementById("importBtn").onclick = ()=>{
  document.getElementById("fileInput").click();
};
document.getElementById("fileInput").onchange = (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  iemsg("Lecture du fichier…");
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array"});
      const sheetName = wb.SheetNames.includes("Planning") ? "Planning" : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});

      // 1) repérer la ligne d'en-tête : celle qui contient "Date" en colonne B (idx 1)
      let headerIdx = -1;
      for(let r=0; r<rows.length; r++){
        const c = rows[r] && rows[r][1];
        if(c && String(c).trim().toLowerCase()==="date"){ headerIdx = r; break; }
      }
      // 2) lire les prénoms à partir de la colonne E (idx 4), arrêt à la 1re cellule vide
      let importedPeople = [];
      if(headerIdx>=0){
        const hrow = rows[headerIdx];
        for(let c=4; c<4+MAX_PEOPLE; c++){
          const v = hrow[c];
          if(v===undefined || v===null || String(v).trim()===""){ break; }
          importedPeople.push(String(v).trim());
        }
      }
      if(importedPeople.length===0){
        // pas d'en-tête trouvée : on garde la liste courante
        importedPeople = PEOPLE.slice();
        if(headerIdx<0){
          iemsg("Ligne d'en-tête introuvable. Vérifiez que la colonne B contient « Date ».", "err");
          ev.target.value = "";
          return;
        }
      }

      // 3) lire les affectations, alignées sur les colonnes des prénoms importés
      const next = {};
      let count = 0;
      for(let r=0; r<rows.length; r++){
        if(r===headerIdx) continue;
        const row = rows[r] || [];
        const iso = excelDateToISO(row[1]);
        if(!iso) continue;
        const ferie = (row[3]===1 || row[3]==="1") ? 1 : 0;
        const a = {};
        let has = false;
        for(let i=0;i<importedPeople.length;i++){
          const v = row[4+i];
          if(v!==undefined && v!==null && String(v).trim()!==""){
            a[importedPeople[i]] = String(v).trim();
            has = true;
          }
        }
        if(has || ferie){ next[iso] = {f:ferie, a:a}; count++; }
      }
      if(count===0){
        iemsg("Aucune donnée reconnue. Vérifiez la structure du fichier.", "err");
        ev.target.value = "";
        return;
      }

      // 4) appliquer : nouvelle liste de personnes + nouveau planning
      PEOPLE = importedPeople;
      DATA = next;
      filterPerson = "all";
      saveData();
      buildChips();
      const keys = Object.keys(DATA).sort();
      curMonday = mondayOf(new Date(keys[0]));
      render();
      iemsg("✓ Import réussi : "+importedPeople.length+" personnes, "+count+" jours.", "ok");
    }catch(err){
      iemsg("Erreur de lecture du fichier : "+err.message, "err");
    }
    ev.target.value = "";
  };
  reader.onerror = ()=>{ iemsg("Impossible de lire le fichier.", "err"); };
  reader.readAsArrayBuffer(file);
};

// --- Masquer le header au défilement (mobile portrait) ---
// Vers le bas : le header se cache. Vers le haut : il revient.
(function setupHideOnScroll(){
  let lastY = window.scrollY;
  let ticking = false;
  window.addEventListener("scroll", ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      if(window.innerWidth <= 680){
        const head = document.querySelector("header");
        const y = window.scrollY;
        const delta = y - lastY;
        if(y < 60){
          // Tout en haut : header visible
          if(head) head.classList.remove("hidden");
        } else if(delta > 6){
          // Vers le bas : on cache
          if(head) head.classList.add("hidden");
        } else if(delta < -6){
          // Vers le haut : on réaffiche
          if(head) head.classList.remove("hidden");
        }
        lastY = y;
      }
      ticking = false;
    });
  }, {passive:true});
})();

(async function init(){
  initSupabase();
  await Promise.all([ loadData(), loadLocalEvents() ]);
  subscribeRealtime();
  // Déverrouillage auto des agendas perso si cet appareil est mémorisé
  if(localStorage.getItem("fstv_perso") === PIN_HASH){
    await new Promise(resolve=>{
      persoUnlocked = true;
      AGENDAS_PERSO.forEach(ag=>{
        if(!GAGENDAS.find(a=>a.id===ag.id && a.icsUrl===ag.icsUrl)) GAGENDAS.push(ag);
      });
      const timeMin = "2026-01-01T00:00:00Z";
      const timeMax = "2028-01-01T00:00:00Z";
      Promise.all(AGENDAS_PERSO.map(ag=>{
        if(ag.icsUrl) return loadIcsAgenda(ag);
        return loadGoogleApiAgenda(ag, timeMin, timeMax);
      })).then(resolve);
    });
  }
  // Restaurer l'état des agendas masqués pour cet appareil
  try{
    const raw = localStorage.getItem("hiddenAgendas");
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) hiddenAgendas = new Set(arr);
    }
  }catch(e){ /* ignore */ }
  // Restaurer le filtre Personne
  try{
    const fp = localStorage.getItem("filterPerson");
    if(fp) filterPerson = fp;
  }catch(e){ /* ignore */ }
  // semaine de départ : si la date système est en 2026, on prend la semaine en cours ;
  // sinon, on prend la 1re semaine de 2026 qui contient des affectations.
  const now = new Date();
  let start;
  if(now.getFullYear()===2026 || now.getFullYear()===2027){
    start = now;
  } else {
    const keys = Object.keys(DATA).sort();
    start = keys.length ? new Date(keys[0]) : new Date(now.getFullYear(),0,1);
  }
  curMonday = mondayOf(start);
  buildChips();
  buildLegend();
  updateLockBtn();
  setMode(false);
  // En vue mobile portrait, positionner le défilement sur la carte du jour (ou la semaine)
  if(window.innerWidth <= 680){
    requestAnimationFrame(()=>{
      const target = document.getElementById("today") || document.getElementById("thisweek");
      if(target) target.scrollIntoView({block:"start"});
    });
  }
  // Charger les agendas Google en arrière-plan (n'attend pas pour afficher le planning)
  loadGoogleAgendas().then(render);
  setInterval(()=>{ loadGoogleAgendas().then(render); }, 5*60*1000);
})();

// Service worker désactivé : on désinscrit toute installation précédente pour éviter
// les soucis de cache sur iOS (WebView PWA).
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
  }).catch(()=>{});
}
