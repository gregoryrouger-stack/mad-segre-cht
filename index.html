<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plannings équipe</title>
<!-- PWA : installable et fonctionnement hors connexion -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e2e2dc">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning">
<style>
:root{
  --bg:#e2e2dc; --bg-soft:#f4f4f1; --card:#ffffff; --ink:#2c2c2a; --muted:#6b6b66;
  --line:#e3e3de; --line2:#cfcfc8;
  /* couleurs des cases pleines : fond soutenu + texte foncé lisible */
  --segre:#6b5300; --segre-bg:#f5d54a;
  --cht:#0d3d6b; --cht-bg:#7fb2e0;
  --sable:#4a2d63; --sable-bg:#cdb6e3;
  --cp:#7a1010; --cp-bg:#e8736e;
  --abs:#5f5e5a; --abs-bg:#e7e5dd;
  --ferie:#5a1414; --ferie-bg:#d99b9b;
  --accent:#534ab7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.wrap{max-width:none;margin:0;padding:20px 24px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:20px;position:relative}
h1{font-size:21px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--card);
  color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;transition:.12s}
.btn:hover{background:var(--bg);border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
/* Bouton "+ Événement" : mis en avant (couleur lavande, centré horizontalement dans le header en PC) */
.newevent-btn{background:#7a72cf;color:#fff;border-color:#7a72cf;font-weight:600}
.newevent-btn:hover{background:#6b62c4;border-color:#6b62c4;color:#fff}
@media(min-width:1101px){
  .newevent-btn{position:absolute;left:50%;top:0;transform:translateX(-50%)}
}
/* Bouton "Filtres" : caché par défaut (desktop), affiché uniquement en mobile portrait */
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.tgroup{display:flex;flex-direction:column;gap:6px}
.tlabel{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);
  background:var(--card);cursor:pointer;transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line2);
  border-radius:8px;background:var(--card);color:var(--ink)}
.personsel{min-width:140px}

/* --- Modale d'événement --- */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.modal-panel{position:relative;background:var(--card);border-radius:12px;
  width:min(440px, calc(100vw - 32px));max-height:90vh;overflow:auto;
  box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--muted);padding:0;width:28px;height:28px;line-height:1}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.modal-body .fld{display:flex;flex-direction:column;gap:5px}
.modal-body .fld>span{font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.modal-body .fld>span em{color:var(--ferie);font-style:normal}
.modal-body .fld input,.modal-body .fld select,.modal-body .fld textarea{
  font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line2);
  border-radius:7px;background:var(--card);color:var(--ink);width:100%}
.modal-body .fld textarea{resize:vertical;min-height:60px;font-family:inherit}
.modal-body .fld-row{display:flex;gap:10px}
.modal-body .fld-row .fld{flex:1}
.modal-msg{font-size:12.5px;color:var(--ferie);min-height:18px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;
  border-top:1px solid var(--line);background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-danger{background:var(--card);color:var(--ferie);border-color:var(--ferie);margin-right:auto}
.btn-danger:hover{background:var(--ferie-bg)}
.btn-sm{font:inherit;font-size:12px;padding:4px 10px;border:1px solid var(--line2);
  border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.btn-sm:hover{background:var(--bg)}
.attachment-zone{display:flex;flex-direction:column;gap:8px}
.attachment-link{display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:#1a2a4d;text-decoration:none;
  padding:6px 12px;border:1px solid var(--line2);border-radius:7px;background:var(--bg-soft)}
.attachment-link:hover{background:var(--card);border-color:#1a2a4d}
.attachment-msg{font-size:12px;color:var(--muted);margin-left:8px}
#attachmentCurrent{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Section export ICS */
.export-ics-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.export-ics-section .tlabel{margin-bottom:8px}
@media(max-width:1100px){.export-ics-section{display:none}}
.export-ics-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.export-ics-hint{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
/* Récurrence dans la modale */
.recurrence-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.recurrence-end-label{font-size:12px;color:var(--muted)}
#recurrenceEndWrap{display:flex;align-items:center;gap:6px}
.agev-local{position:relative}
.agev-local:hover{filter:brightness(1.05)}

/* Affichage du commentaire en mode lecture seule (avec numéros cliquables) */
.comment-view{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line2);
  border-radius:7px;background:var(--bg-soft);color:var(--ink);white-space:pre-wrap;
  word-wrap:break-word;line-height:1.5;max-height:200px;overflow:auto}
.tel-link{color:#1a2a4d;font-weight:600;text-decoration:underline}
.tel-link:hover{color:var(--accent)}
/* Chips de numéros sous le textarea, mises à jour en direct */
.tel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tel-chip{display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:18px;background:var(--bg-soft);
  border:1px solid var(--line2);color:#1a2a4d;font-size:13px;font-weight:600;
  text-decoration:none;cursor:pointer}
.tel-chip:hover{background:var(--card);border-color:#1a2a4d}
.tel-chip-icon{font-size:14px}

/* Section Contacts équipe (dans le panneau Filtres) */
.contacts-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.contacts-section .tlabel{margin-bottom:8px}
.contacts-list{display:flex;flex-direction:column;gap:6px}
.contact-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.contact-name{font-size:13px;font-weight:600;color:var(--ink);min-width:80px}
.contact-input{font:inherit;font-size:13px;padding:5px 9px;
  border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);
  flex:1;min-width:140px}
.contact-empty{font-size:12px;color:var(--muted);font-style:italic}

/* Bouton "Ouvrir dans le GPS" sous le champ Lieu */
.gps-btn{margin-top:6px;align-self:flex-start;font:inherit;font-size:13px;
  padding:6px 12px;border:1px solid var(--line2);border-radius:7px;
  background:var(--card);color:var(--accent);cursor:pointer;font-weight:500}
.gps-btn:hover{background:var(--bg)}
/* Mini menu Google Maps / Waze */
.gps-menu{position:absolute;z-index:200;background:var(--card);
  border:1px solid var(--line2);border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.15);padding:4px;min-width:140px;
  display:flex;flex-direction:column}
.gps-menu-item{padding:8px 12px;text-decoration:none;color:var(--ink);
  font-size:14px;border-radius:5px;display:block}
.gps-menu-item:hover{background:var(--bg)}
.nav{display:flex;align-items:center;gap:10px}
.nav .wk{font-size:14px;font-weight:600;min-width:230px;text-align:center}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden}
/* Panneau de filtres : overlay coulissant du haut, déclenché par le bouton ⚙ Filtres */
.ctrlbar{position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--card);padding:18px 22px 20px;
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.18);
  max-width:760px;margin:0 auto;border-radius:0 0 12px 12px;
  transform:translateY(-100%);transition:transform .25s ease;
  max-height:90vh;overflow-y:auto}
.ctrlbar.open{transform:translateY(0)}
/* Panneau Contacts équipe : overlay coulissant */
.contacts-panel{position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--card);padding:18px 22px 20px;
  border-bottom:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.18);
  max-width:520px;margin:0 auto;border-radius:0 0 12px 12px;
  transform:translateY(-100%);transition:transform .25s ease}
.contacts-panel.open{transform:translateY(0)}
/* Voile partagé entre les deux panneaux */
.filters-backdrop, .contacts-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:49;
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.filters-backdrop.open, .contacts-backdrop.open{opacity:1;pointer-events:auto}
/* Bouton de fermeture commun (en haut à droite du panneau) */
.ctrlbar-close{position:absolute;top:10px;right:10px;
  width:36px;height:36px;border-radius:50%;border:none;
  background:transparent;color:var(--muted);font-size:22px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1}
.ctrlbar-close:hover{background:var(--bg-soft)}
/* mini barre de navigation en haut du tableau (paysage / ordinateur) */
.topnav{display:flex;align-items:center;justify-content:space-between;
  padding:5px 8px;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.topnav-btn{background:var(--card);border:1px solid var(--line2);border-radius:6px;
  width:30px;height:26px;font:inherit;font-size:14px;line-height:1;cursor:pointer;
  color:var(--ink);transition:.12s}
.topnav-btn:hover{background:var(--bg);border-color:var(--muted)}
.topnav-label{font-size:12px;font-weight:600;color:var(--muted)}
table.sched{width:100%;border-collapse:collapse;table-layout:fixed}
table.sched th,table.sched td{border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;vertical-align:middle}
table.sched th:last-child,table.sched td:last-child{border-right:none}
table.sched tr:last-child td{border-bottom:none}
.colname{width:108px;text-align:left !important;background:var(--bg-soft);
  font-weight:600;font-size:13px;padding-left:12px !important;position:sticky;left:0;z-index:2}
thead .colname{background:var(--bg-soft)}
.dayhead{font-size:11px;font-weight:600;text-transform:uppercase;
  color:var(--muted);letter-spacing:.03em;line-height:1.35}
.dayhead .dnum{display:block;font-size:15px;font-weight:600;color:var(--ink);
  text-transform:none;letter-spacing:0;margin-top:1px}
.dayhead.ferie .dnum{color:var(--ferie)}
.dayhead.ferie{color:var(--ferie)}
.dayhead.today{background:rgba(83,74,183,.10)}
.col-ferie{background:var(--ferie-bg)}
.col-today{background:rgba(83,74,183,.05)}
/* le férié garde sa couleur même si une classe fill est aussi présente */
table.sched td.col-ferie{background:var(--ferie-bg) !important;color:var(--ferie)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;
  border-radius:5px;white-space:nowrap;cursor:default;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.editsel{font:inherit;font-size:11.5px;padding:3px 4px;border:1px solid var(--line2);
  border-radius:5px;background:var(--card);width:100%;max-width:104px}
/* Mode manager : deux selects AM/PM côte à côte */
.editsplit{display:inline-flex;gap:3px;width:100%;max-width:100%}
.editsplit .editsel{flex:1;min-width:0;max-width:none}
.prow .editsplit{flex:1;max-width:none}
.prow .editsplit .editsel{font-size:12.5px;padding:4px 5px}
/* --- événements Google Agenda --- */
.gevs{display:flex;flex-direction:column;gap:2px;padding:3px 2px;
  border-bottom:1px dashed var(--line)}
.gev{display:flex;align-items:center;gap:5px;font-size:10px;line-height:1.2;
  color:var(--ink);overflow:hidden}
.gev .gdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.gev .gtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.daycard .gevs{padding:6px 14px 4px;background:#fbfbf8;border-bottom:1px solid var(--line)}
.daycard .gev{font-size:12px}
.daycard .gev .gdot{width:9px;height:9px}
/* --- lignes d'agendas dans le tableau --- */
tr.agrow td.agname{font-size:12px;font-weight:600;color:var(--ink);
  background:var(--bg-soft);padding:8px 10px;vertical-align:top}
tr.agrow td.agname .agtitle{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
tr.agrow td.agname .aglegend{display:flex;flex-direction:column;gap:3px}
tr.agrow td.agname .aglg{display:flex;align-items:center;gap:5px;font-size:11px;
  font-weight:500;color:var(--ink)}
tr.agrow td.agname .aglg .gdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
tr.agrow td.agcell{vertical-align:top;text-align:left;font-size:13px;line-height:1.35;
  padding:5px 5px;color:var(--ink);background:#fafaf6;border-top:2px solid var(--line2)}
tr.agrow td.agname{border-top:2px solid var(--line2)}
tr.agrow td.agcell.col-ferie{background:var(--ferie-bg) !important;color:var(--ferie)}
tr.agrow td.agcell.col-today{background:rgba(83,74,183,.06)}
.agev{display:block;margin:2px 0;
  padding:3px 6px;border-radius:4px;line-height:1.35;font-size:13px}
.agev+.agev{margin-top:3px}
.agev .aghour{font-weight:700;white-space:nowrap;margin-right:8px;display:inline-block;min-width:36px}
.agev .agtxt{overflow-wrap:break-word;word-break:break-word}
/* vue mobile : section Agendas en bas de chaque carte-jour */
.agsep-mobile{font-size:13px;font-weight:700;color:#1a2a4d;
  letter-spacing:.05em;text-transform:uppercase;padding:10px 14px 8px;
  background:#fff;
  border-top:2px solid #1a2a4d}
.daycard.ferie .agsep-mobile{color:var(--ferie);border-top-color:var(--ferie)}
.agev-mobile-row{display:block;position:relative;padding:13px 52px 13px 76px;
  font-size:14px;line-height:1.4;min-height:1.4em}
.agev-mobile-row+.agev-mobile-row{border-top:1px solid rgba(255,255,255,.6)}
.agev-mobile-row .aghour{position:absolute;left:14px;top:13px;width:54px;
  font-weight:700;white-space:nowrap;text-align:left}
.agev-mobile-row .agtxt{display:block;overflow-wrap:break-word;word-break:break-word}
/* Icônes à droite signalant le contenu de l'événement (📞 téléphone, 📍 lieu, ✎ modifiable, ⓘ commentaire) */
.ageninfo{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:.85;line-height:1;pointer-events:none;font-weight:400;
  display:inline-flex;gap:2px}
.agev{position:relative;padding-right:42px}
.agev .ageninfo{right:5px;font-size:11px}
/* --- vue liste (mobile uniquement) --- */
.listview{display:none}
.daycard{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:60px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.daycard.ferie{border-color:#f0c9c9}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(83,74,183,.18)}
.dch{display:flex;align-items:baseline;gap:10px;padding:12px 14px 10px;
  background:#fff;color:#1a2a4d}
.dch .dcname{font-size:18px;font-weight:700;text-transform:capitalize;color:#1a2a4d}
.dch .dcnum{font-size:18px;font-weight:700;color:#1a2a4d}
.dch .dcferie{margin-left:auto;font-size:11px;font-weight:700;
  color:#fff;background:var(--ferie);padding:2px 8px;border-radius:4px;
  text-transform:uppercase;letter-spacing:.04em}
.daycard.ferie .dch .dcname,.daycard.ferie .dch .dcnum{color:var(--ferie)}
.prow{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--card)}
.prow+.prow{border-top:1px solid var(--line)}
.prow .pname{font-size:13.5px;font-weight:500;flex:0 0 90px}
/* Zone d'affectation à droite : largeur identique pour toutes les lignes */
.affzone{display:flex;gap:6px;flex:1;justify-content:stretch;min-width:0}
.affsingle,.affzone .splithalf{flex:1;font-size:13px;font-weight:700;padding:6px 8px;
  border-radius:5px;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.prow .pill{font-size:12px;padding:4px 10px}
.prow select.editsel{max-width:140px;font-size:13px;padding:5px 7px}
@media(max-width:680px){
  /* Fond extérieur un peu plus foncé en mobile portrait, pour mettre les cartes en valeur */
  html, body{background:#e2e2dc}
  /* La header et la ctrlbar doivent rester sur le même fond que le body, pas blanc */
  header{background:#e2e2dc !important}
  .ctrlbar{background:#e2e2dc !important}
  /* Bandeau date : légèrement plus foncé que le fond extérieur, comme une étiquette */
  .dch{background:#d0d0c7}

  .wrap{padding:0 10px 50px}
  /* En mobile portrait, libérer la place dans le header */
  h1{display:none}
  /* "● Synchronisé" masqué quand tout va bien (mais on garde "● Hors ligne" si erreur) */
  #connState.ok{display:none}
  .tablewrap{display:none}
  .toolbar{padding:11px 12px;gap:12px}
  header{order:1;position:sticky;top:0;z-index:6;background:var(--bg);
    margin:0;padding:6px 0;
    transition:transform .25s ease}
  header.hidden{transform:translateY(-100%)}
  .ctrlbar .toolbar{margin-bottom:8px}
  /* Bouton Filtres : visible uniquement en mobile portrait */
  .filtersbtn-mobile{display:inline-flex !important}
  /* Le bouton "Activer le mode manager" n'est pas utile en mobile portrait */
  #modeBtn{display:none}
  .listview{order:3;display:block}
  .legend{display:none}
  .banner{display:none}
  .wkhead{font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em;margin:16px 4px 8px;
    padding-top:8px;border-top:1px solid var(--line);
    scroll-margin-top:80px}
  .wkhead:first-child{border-top:none;padding-top:0;margin-top:2px}
  /* Quand on scroll vers la carte du jour ou de la semaine, laisser un espace
     pour que le header sticky ne la cache pas */
  .daycard{scroll-margin-top:80px}
}
/* --- vue intermédiaire : mobile en paysage / petite tablette (681-1100 px) --- */
@media(min-width:681px) and (max-width:1100px){
  .wrap{padding:14px 12px 40px}
  h1{font-size:19px}
  /* tableau compacté pour gagner de la place horizontale */
  table.sched th,table.sched td{padding:5px 3px;font-size:12px}
  .colname{width:72px !important;padding-left:8px !important;font-size:12px}
  .dayhead{font-size:10px}
  .dayhead .dnum{font-size:12px}
  .celltext{font-size:11.5px}
  .diag-am,.diag-pm{font-size:10px}
  /* ligne agendas : réduire la police et la zone de la colonne nom */
  tr.agrow td.agname{padding:6px 6px;font-size:11px}
  tr.agrow td.agname .agtitle{font-size:10px;margin-bottom:3px}

/* --- remplissage de la case entière --- */
.celltext{font-size:11.5px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:100%;display:inline-block}
/* --- case scindée en diagonale (libellé AM/PM) --- */
table.sched td.fill-diag{position:relative;padding:0 !important;
  background:transparent !important;color:inherit !important;
  height:1px /* astuce : oblige le div interne en 100% à occuper toute la cellule */}
.diag{position:relative;width:100%;height:100%;min-height:38px;display:block}
.diag-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.diag-am,.diag-pm{position:absolute;font-size:10.5px;font-weight:700;line-height:1;
  white-space:nowrap;pointer-events:none}
.diag-am{top:4px;left:5px}
.diag-pm{bottom:4px;right:5px}
/* mobile : alias pour rétro-compatibilité (splitwrap = affzone) */

.splitwrap .splithalf{flex:1;font-size:13px;font-weight:700;padding:6px 8px;
  border-radius:5px;text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
table.sched td.fill-Segré{background:var(--segre-bg);color:var(--segre)}

table.sched td.fill-Sablé{background:var(--sable-bg);color:var(--sable)}
table.sched td.fill-CP{background:var(--cp-bg);color:var(--cp)}
table.sched td.fill-abs{background:var(--abs-bg);color:var(--abs)}

<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="appTitle">Plannings de l'équipe</h1>
    </div>
    <div class="modebar">
      <span id="connState" style="font-size:12px;font-weight:600">● Connexion…</span>
      <span id="savemark" class="savemark"></span>
      <button id="todayW" class="btn">Aujourd'hui</button>
      <button id="filtersBtn" class="btn" aria-label="Filtres">⚙ Filtres</button>
      <button id="contactsBtn" class="btn" aria-label="Contacts">📞 Contacts</button>
      <button id="newEventBtn" class="btn newevent-btn">＋ Événement</button>
      <button id="modeBtn" class="btn">Activer le mode manager</button>
    </div>
  </header>

  <div class="tablewrap">
    <div class="topnav">
      <button class="topnav-btn" id="prevWTop" title="Semaine précédente">‹</button>
      <span class="topnav-label" id="wkLabelTop"></span>
      <button class="topnav-btn" id="nextWTop" title="Semaine suivante">›</button>
    </div>
    <table class="sched" id="grid"></table>
  </div>
  <div class="listview" id="listview"></div>

  <div class="filters-backdrop" id="filtersBackdrop"></div>
  <div class="ctrlbar" id="ctrlbar">
    <button class="ctrlbar-close" id="ctrlbarClose" aria-label="Fermer">✕</button>
    <div class="toolbar">
      <div class="tgroup">
        <span class="tlabel">Magasin</span>
        <div class="chips" id="storeChips"></div>
      </div>
      <div class="tgroup">
        <span class="tlabel">Personne</span>
        <select id="personSelect" class="personsel"></select>
      </div>
      <div class="tgroup">
        <span class="tlabel">Agendas</span>
        <div class="chips" id="agendaChips"></div>
      </div>
    </div>

    <div class="iebar" id="iebar" style="display:none">
      <span class="ielabel">Fichier Excel</span>
      <button class="btn" id="importBtn">Importer un fichier Excel</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
      <span class="iemsg" id="iemsg"></span>
    </div>

    <div class="export-ics-section">
      <div class="tlabel">Exporter mon planning</div>
      <div class="export-ics-row">
        <select id="icsPersonSelect" class="personsel"></select>
        <button class="btn" id="icsExportBtn">📅 Télécharger .ics</button>
      </div>
      <div class="export-ics-hint">Importable dans Google Agenda, Apple Calendrier, Outlook…</div>
    </div>

    <!-- Bouton cadenas discret (agendas perso) -->
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line);text-align:right">
      <button id="persoLockBtn" style="background:none;border:none;cursor:pointer;font-size:18px;opacity:0.3;padding:4px 6px" title="">🔒</button>
    </div>

  </div>

  <!-- Panneau Contacts équipe (overlay coulissant, déclenché par le bouton 📞 Contacts) -->
  <div class="contacts-backdrop" id="contactsBackdrop"></div>
  <div class="contacts-panel" id="contactsPanel">
    <button class="ctrlbar-close" id="contactsClose" aria-label="Fermer">✕</button>
    <div class="tlabel">Contacts équipe</div>
    <div class="contacts-list" id="contactsList"></div>
  </div>
</div>

<!-- Modale de création/édition d'un événement appli -->
<div id="evModal" class="modal" style="display:none">
  <div class="modal-backdrop"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <span id="evModalTitle">Nouvel événement</span>
      <button class="modal-close" id="evModalClose" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body">
      <label class="fld">
        <span>Titre <em>*</em></span>
        <input type="text" id="evTitle" placeholder="Ex : Livraison Auchan">
      </label>
      <div class="fld-row">
        <label class="fld">
          <span>Date <em>*</em></span>
          <input type="date" id="evDate">
        </label>
        <label class="fld">
          <span>Heure <em>*</em></span>
          <input type="time" id="evHour">
        </label>
      </div>
      <!-- Récurrence -->
      <div class="fld" id="recurrenceField">
        <span>Récurrence</span>
        <div class="recurrence-row">
          <select id="evRecurrence">
            <option value="none">Aucune</option>
            <option value="weekly">Chaque semaine</option>
            <option value="biweekly">Chaque 2 semaines</option>
            <option value="monthly">Chaque mois</option>
            <option value="daily">Chaque jour (lun-sam)</option>
          </select>
          <div id="recurrenceEndWrap" style="display:none">
            <label class="recurrence-end-label">jusqu'au</label>
            <input type="date" id="evRecurrenceEnd">
          </div>
        </div>
      </div>
      <label class="fld">
        <span>Agenda <em>*</em></span>
        <select id="evAgenda"></select>
      </label>
      <label class="fld">
        <span>Lieu</span>
        <input type="text" id="evLocation" placeholder="Optionnel">
      </label>
      <label class="fld">
        <span>Commentaire</span>
        <textarea id="evComment" rows="3" placeholder="Optionnel"></textarea>
      </label>
      <!-- Bon de livraison (PDF) -->
      <div class="fld" id="attachmentField">
        <span>Bon de livraison (PDF)</span>
        <div class="attachment-zone" id="attachmentZone">
          <div id="attachmentCurrent" style="display:none">
            <a id="attachmentLink" href="#" target="_blank" class="attachment-link">📄 Voir le bon</a>
            <button type="button" class="btn btn-sm" id="attachmentRemove">✕ Retirer</button>
          </div>
          <div id="attachmentUpload">
            <input type="file" id="attachmentFile" accept="application/pdf" style="display:none">
            <button type="button" class="btn btn-sm" id="attachmentBtn">📎 Joindre un bon</button>
            <span class="attachment-msg" id="attachmentMsg"></span>
          </div>
        </div>
      </div>
      <div class="modal-msg" id="evMsg"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger" id="evDelete" style="display:none">Supprimer</button>
      <button class="btn" id="evEdit" style="display:none">✎ Modifier</button>
      <button class="btn" id="evCancel">Annuler</button>
      <button class="btn btn-primary" id="evSave">Enregistrer</button>
    </div>
  </div>
</div>

// Parse minimal d'un fichier .ics (Google) : récupère VEVENT -> {date, title}
function parseICS(text){
  const events = [];
  const blocks = text.split(/BEGIN:VEVENT/i).slice(1);
  for(const blk of blocks){
    const end = blk.search(/END:VEVENT/i);
    if(end<0) continue;
    const body = blk.slice(0,end);
    // unfold : les lignes pliées commencent par un espace
    const unfolded = body.replace(/\r?\n[ \t]/g, "");
    const lines = unfolded.split(/\r?\n/);
    let title = "", dt = "", allDay = false;
    for(const ln of lines){
      if(ln.startsWith("SUMMARY")) title = ln.replace(/^SUMMARY[^:]*:/,"").trim();
      else if(ln.startsWith("DTSTART")){
        const head = ln.split(":")[0];
        dt = ln.substring(ln.indexOf(":")+1).trim();
        if(head.indexOf("VALUE=DATE")>=0 && head.indexOf("DATE-TIME")<0) allDay = true;
      }
    }
    if(!dt) continue;
    // formats : 20260512  ou  20260512T093000Z
    let y, m, d;
    if(/^\d{8}/.test(dt)){
      y = +dt.slice(0,4); m = +dt.slice(4,6); d = +dt.slice(6,8);
    } else continue;
    const iso = y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    // ignorer hors 2026 (cohérence avec le planning)
    if(y!==2026 && y!==2027) continue;
    // décoder échappements ICS basiques
    title = title.replace(/\\n/g,"\n").replace(/\\,/g,",").replace(/\\;/g,";");
    events.push({ iso, title: title || "(sans titre)" });
  }
  return events;
}

      + "&timeMax=" + encodeURIComponent(timeMax);
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok){
        const errTxt = await r.text();
        console.warn("Échec lecture agenda", ag.name, ":", r.status, errTxt.slice(0,200));
        return;
      }
      const data = await r.json();
      if(!data.items){ return; }
      for(const it of data.items){
        // date de début : soit "date" (toute la journée), soit "dateTime"
        const startObj = it.start || {};
        const dt = startObj.date || startObj.dateTime || "";
        if(!dt) continue;
        const iso = dt.slice(0,10);
        if(!iso.startsWith("2026") && !iso.startsWith("2027")) continue;
        // heure : si dateTime, on extrait HH:mm en heure locale du navigateur
        let hour = "", sortKey = -1; // -1 = toute la journée (affiché en premier)
        if(startObj.dateTime){
          const d = new Date(startObj.dateTime);
          if(!isNaN(d.getTime())){
            const hh = d.getHours(), mm = d.getMinutes();
            sortKey = hh*60 + mm;
            hour = String(hh).padStart(2,"0") + "h" + String(mm).padStart(2,"0");
            if(hour.endsWith("h00")) hour = hour.slice(0,-2);
          }
        }
        const title = (it.summary || "(sans titre)").trim();
        const location = (it.location || "").trim();
        const comment = (it.description || "").trim();
        if(!GEVENTS[iso]) GEVENTS[iso] = [];
        GEVENTS[iso].push({ name: ag.name, color: ag.color, bg: ag.bg, ink: ag.ink, title, hour, sortKey, location, comment, date: iso, perso: !!ag.perso });
      }
    }catch(err){
      console.warn("Erreur réseau agenda", ag.name, ":", err.message);
    }
}

// Chargement d'un agenda via flux ICS (proxy Cloudflare Worker).
async function loadIcsAgenda(ag){
  try{
    const r = await fetch(ag.icsUrl, {cache:"no-store"});
    if(!r.ok){
      console.warn("Échec lecture ICS", ag.name, ":", r.status);
      return;
    }
    const text = await r.text();
    const events = parseIcs(text);
    // Détecte "livraison STOKBOX" (casse insensible)
    const RE_LIVRAISON_STOKBOX = /livraison\s+stokbox/i;
    // Détecte "reprise STOKBOX" (casse insensible)
    const RE_REPRISE_STOKBOX = /reprise\s+stokbox/i;
    // Détecte "12t5" avec variantes : 12T5, 12 t 5, 12.t.5, 12-t-5, etc.
    const RE_12T5 = /\b12\s*[.\-]?\s*[tT]\s*[.\-]?\s*5\b/;
    // Rouge — pour les titres contenant "12t5" (priorité sur tout)
    const RED_BG = "#e87171";
    const RED_INK = "#5a1414";
    const RED_COLOR = "#c64545";
    // Orange foncé — pour "Livraison STOKBOX" sans 12t5
    const ORANGE_FONCE_BG = "#f0a55c";
    const ORANGE_FONCE_INK = "#5a2e0a";
    const ORANGE_FONCE_COLOR = "#c87a2e";
    // Orange clair — pour "Reprise STOKBOX" sans 12t5
    const ORANGE_CLAIR_BG = "#f5c490";
    const ORANGE_CLAIR_INK = "#5a3a14";
    const ORANGE_CLAIR_COLOR = "#cc9656";
    for(const ev of events){
      if(!ev.date) continue;
      if(!ev.date.startsWith("2026") && !ev.date.startsWith("2027")) continue;
      if(!GEVENTS[ev.date]) GEVENTS[ev.date] = [];
      const title = ev.title || "";
      let bg = ag.bg, ink = ag.ink, color = ag.color;
      // Priorité : rouge > orange foncé (livraison) > orange clair (reprise) > mauve par défaut
      if(RE_12T5.test(title)){
        bg = RED_BG; ink = RED_INK; color = RED_COLOR;
      } else if(RE_LIVRAISON_STOKBOX.test(title)){
        bg = ORANGE_FONCE_BG; ink = ORANGE_FONCE_INK; color = ORANGE_FONCE_COLOR;
      } else if(RE_REPRISE_STOKBOX.test(title)){
        bg = ORANGE_CLAIR_BG; ink = ORANGE_CLAIR_INK; color = ORANGE_CLAIR_COLOR;
      }
      GEVENTS[ev.date].push({
        name: ag.name, color, bg, ink,
        title, hour: ev.hour, sortKey: ev.sortKey,
        location: ev.location, comment: ev.comment, date: ev.date
      });
    }
  }catch(err){
    console.warn("Erreur réseau ICS", ag.name, ":", err.message);
  }
}

// Parser ICS minimaliste : extrait SUMMARY, DTSTART, LOCATION de chaque VEVENT.
// Gère :
//  - les lignes pliées (continuation par espace/tab) ;
//  - les dates "YYYYMMDD" (toute la journée) et "YYYYMMDDTHHMMSSZ" (avec heure UTC) ;
//  - les TZID locaux (heure prise telle quelle).
// N'expanse PAS les événements récurrents — ce qui est conforme : si Outlook
// publie via Microsoft, les occurrences récurrentes sont en général dépliées
// côté serveur. À vérifier à l'usage.
function parseIcs(text){
  // Recoller les lignes pliées (RFC 5545 : continuation = ligne commençant par espace ou tab)
  const lines = [];
  const raw = text.replace(/\r\n/g, "\n").split("\n");
  for(const line of raw){
    if((line.startsWith(" ") || line.startsWith("\t")) && lines.length > 0){
      lines[lines.length-1] += line.slice(1);
    } else {
      lines.push(line);
    }
  }

  const events = [];
  let cur = null;
  for(const line of lines){
    if(line === "BEGIN:VEVENT"){
      cur = {};
    } else if(line === "END:VEVENT"){
      if(cur){
        const parsed = finalizeIcsEvent(cur);
        if(parsed) events.push(parsed);
      }
      cur = null;
    } else if(cur){
      // séparer "PROP;PARAMS:VALUE"
      const colonIdx = line.indexOf(":");
      if(colonIdx < 0) continue;
      const left = line.slice(0, colonIdx);
      const value = line.slice(colonIdx + 1);
      const [propName, ...paramParts] = left.split(";");
      const params = {};
      paramParts.forEach(p=>{
        const eq = p.indexOf("=");
        if(eq > 0) params[p.slice(0,eq).toUpperCase()] = p.slice(eq+1);
      });
      const up = propName.toUpperCase();
      if(up === "SUMMARY") cur.summary = unescapeIcs(value);
      else if(up === "LOCATION") cur.location = unescapeIcs(value);
      else if(up === "DESCRIPTION") cur.description = unescapeIcs(value);
      else if(up === "DTSTART"){
        cur.dtstart = value;
        cur.dtstartParams = params;
      }
    }
  }
  return events;
}

function unescapeIcs(s){
  return s.replace(/\\n/gi, "\n").replace(/\\,/g, ",").replace(/\\;/g, ";").replace(/\\\\/g, "\\");
}

function finalizeIcsEvent(ev){
  if(!ev.dtstart) return null;
  const v = ev.dtstart;
  let date = "", hour = "", sortKey = -1;
  // Cas 1 : "YYYYMMDD" → toute la journée
  if(/^\d{8}$/.test(v)){
    date = v.slice(0,4)+"-"+v.slice(4,6)+"-"+v.slice(6,8);
  }
  // Cas 2 : "YYYYMMDDTHHMMSSZ" → heure UTC, à convertir en heure locale
  else if(/^\d{8}T\d{6}Z$/.test(v)){
    const d = new Date(
      v.slice(0,4)+"-"+v.slice(4,6)+"-"+v.slice(6,8)+"T"+
      v.slice(9,11)+":"+v.slice(11,13)+":"+v.slice(13,15)+"Z"
    );
    if(!isNaN(d.getTime())){
      const Y = d.getFullYear(), M = d.getMonth()+1, D = d.getDate();
      date = Y+"-"+String(M).padStart(2,"0")+"-"+String(D).padStart(2,"0");
      const hh = d.getHours(), mm = d.getMinutes();
      sortKey = hh*60 + mm;
      hour = String(hh).padStart(2,"0")+"h"+String(mm).padStart(2,"0");
      if(hour.endsWith("h00")) hour = hour.slice(0,-2);
    }
  }
  // Cas 3 : "YYYYMMDDTHHMMSS" sans Z → heure locale (TZID) prise telle quelle
  else if(/^\d{8}T\d{6}$/.test(v)){
    date = v.slice(0,4)+"-"+v.slice(4,6)+"-"+v.slice(6,8);
    const hh = parseInt(v.slice(9,11),10), mm = parseInt(v.slice(11,13),10);
    sortKey = hh*60 + mm;
    hour = String(hh).padStart(2,"0")+"h"+String(mm).padStart(2,"0");
    if(hour.endsWith("h00")) hour = hour.slice(0,-2);
  } else {
    return null;
  }

  return {
    date, hour, sortKey,
    title: (ev.summary || "(sans titre)").trim(),
    location: (ev.location || "").trim(),
    comment: (ev.description || "").trim()
  };
}

// ---- événements appli (table 'events' dans Supabase) ----
// Construit la "carte" d'événement attendue par le rendu, à partir d'une ligne SQL.
function makeEventFromRow(row){
  const ag = GAGENDAS.find(a => a.name === row.agenda);
  let color = ag ? ag.color : "#888";
  let bg = ag ? ag.bg : "#eee";
  let ink = ag ? ag.ink : "#222";

  // Si l'événement est sur l'agenda "Livraison Sablé", appliquer les mêmes règles
  // de couleur que pour les événements Outlook Sablé (rouge, orange foncé, orange clair)
  if(row.agenda === "Livraison Sablé"){
    const title = row.title || "";
    const RE_12T5 = /\b12\s*[.\-]?\s*[tT]\s*[.\-]?\s*5\b/;
    const RE_LIVRAISON_STOKBOX = /livraison\s+stokbox/i;
    const RE_REPRISE_STOKBOX = /reprise\s+stokbox/i;
    if(RE_12T5.test(title)){
      bg = "#e87171"; ink = "#5a1414"; color = "#c64545";
    } else if(RE_LIVRAISON_STOKBOX.test(title)){
      bg = "#f0a55c"; ink = "#5a2e0a"; color = "#c87a2e";
    } else if(RE_REPRISE_STOKBOX.test(title)){
      bg = "#f5c490"; ink = "#5a3a14"; color = "#cc9656";
    }
  }
  // sortKey en minutes pour trier comme les événements Google
  let sortKey = -1;
  const m = (row.hour||"").match(/^(\d{1,2})[h:](\d{0,2})/);
  if(m){
    const h = parseInt(m[1],10);
    const mm = m[2] ? parseInt(m[2],10) : 0;
    sortKey = h*60 + mm;
  }
  return {
    id: row.id,
    isLocal: true,
    name: row.agenda,
    color, bg, ink,
    title: row.title,
    hour: row.hour || "",
    location: row.location || "",
    comment: row.comment || "",
    recurrence_id: row.recurrence_id || null,
    attachment: row.attachment || null,
    date: row.date,
    sortKey
  };
}

async function loadLocalEvents(){
  if(!sb){ EVENTS_LOCAL = {}; return; }
  try{
    const { data, error } = await sb.from("events").select("*");
    if(error) throw error;
    EVENTS_LOCAL = {};
    (data || []).forEach(row=>{
      const ev = makeEventFromRow(row);
      if(!EVENTS_LOCAL[ev.date]) EVENTS_LOCAL[ev.date] = [];
      EVENTS_LOCAL[ev.date].push(ev);
    });
  }catch(e){
    console.warn("loadLocalEvents", e);
    EVENTS_LOCAL = {};
  }
}

async function createLocalEvent(values){
  if(!sb) return { error: "Pas de connexion" };
  const row = {
    date: values.date,
    hour: values.hour,
    title: values.title,
    agenda: values.agenda,
    location: values.location || null,
    comment: values.comment || null,
    attachment: values.attachment || null
  };
  // recurrence_id ajouté uniquement si la colonne existe (après migration Supabase)
  if(values.recurrence_id) row.recurrence_id = values.recurrence_id;
  const { data, error } = await sb.from("events").insert(row).select().single();
  if(error) return { error: error.message };
  // Ajouter localement (l'événement realtime arrivera aussi, mais le toast d'erreur sera évité)
  const ev = makeEventFromRow(data);
  if(!EVENTS_LOCAL[ev.date]) EVENTS_LOCAL[ev.date] = [];
  // éviter doublon si realtime a été plus rapide
  if(!EVENTS_LOCAL[ev.date].some(e => e.id === ev.id)){
    EVENTS_LOCAL[ev.date].push(ev);
  }
  render();
  return { ok: true };
}

async function updateLocalEvent(id, values){
  if(!sb) return { error: "Pas de connexion" };
  const patch = {
    date: values.date,
    hour: values.hour,
    title: values.title,
    agenda: values.agenda,
    location: values.location || null,
    comment: values.comment || null,
    attachment: values.attachment || null
  };
  const { data, error } = await sb.from("events").update(patch).eq("id", id).select().single();
  if(error) return { error: error.message };
  // Mise à jour locale
  for(const ds in EVENTS_LOCAL){
    EVENTS_LOCAL[ds] = EVENTS_LOCAL[ds].filter(e => e.id !== id);
    if(EVENTS_LOCAL[ds].length === 0) delete EVENTS_LOCAL[ds];
  }
  const ev = makeEventFromRow(data);
  if(!EVENTS_LOCAL[ev.date]) EVENTS_LOCAL[ev.date] = [];
  EVENTS_LOCAL[ev.date].push(ev);
  render();
  return { ok: true };
}

async function deleteLocalEvent(id){
  if(!sb) return { error: "Pas de connexion" };
  const { error } = await sb.from("events").delete().eq("id", id);
  if(error) return { error: error.message };
  for(const ds in EVENTS_LOCAL){
    EVENTS_LOCAL[ds] = EVENTS_LOCAL[ds].filter(e => e.id !== id);
    if(EVENTS_LOCAL[ds].length === 0) delete EVENTS_LOCAL[ds];
  }
  render();
  return { ok: true };
}

  // Détermine si la modale démarre en lecture seule :
  // - Google/Outlook (readonly=true) → toujours lecture seule
  // - Événement appli ouvert au clic (ev existe, readonly pas explicitement demandé) → lecture seule avec bouton Modifier
  // - Création d'un nouvel événement (ev=null) → édition directe
  let startReadonly = false;

  if(ev){
    inTitle.value = ev.title || "";
    inDate.value = ev.date || "";
    inHour.value = hourToInput(ev.hour);
    sel.value = ev.name || GAGENDAS[0].name;
    inLoc.value = ev.location || "";
    inCom.value = ev.comment || "";
    // Un événement appli ouvert sans readonly explicite démarre en lecture seule
    // avec un bouton "Modifier" (pour éviter les modifications accidentelles).
    startReadonly = readonly || !!ev.isLocal;
    setupAttachment(ev.attachment || null, startReadonly);
    const editBtn = document.getElementById("evEdit");
    if(readonly){
      // Événement Google/Outlook : toujours lecture seule, jamais modifiable
      titleEl.textContent = "Événement";
      delBtn.style.display = "none";
      saveBtn.style.display = "none";
      if(editBtn) editBtn.style.display = "none";
    } else if(ev.isLocal){
      // Événement appli : lecture seule par défaut, bouton "Modifier" pour activer l'édition
      titleEl.textContent = "Événement";
      delBtn.style.display = "none";
      saveBtn.style.display = "none";
      if(editBtn){
        editBtn.style.display = "";
        editBtn.onclick = ()=>{
          titleEl.textContent = "Modifier l'événement";
          delBtn.style.display = "";
          saveBtn.style.display = "";
          editBtn.style.display = "none";
          setFieldsReadonly(false);
          setupAttachment(currentAttachmentUrl, false);
        };
      }
    } else {
      titleEl.textContent = "Modifier l'événement";
      delBtn.style.display = "";
      saveBtn.style.display = "";
      if(editBtn) editBtn.style.display = "none";
    }
    // Récurrence : masquée en édition (on ne change pas la récurrence d'un existant)
    const recField = document.getElementById("recurrenceField");
    if(recField) recField.style.display = "none";
  } else {
    titleEl.textContent = "Nouvel événement";
    inTitle.value = "";
    inDate.value = fmt(new Date());
    inHour.value = "";
    sel.value = GAGENDAS[0].name;
    inLoc.value = "";
    inCom.value = "";
    setupAttachment(null, false);
    delBtn.style.display = "none";
    saveBtn.style.display = "";
    const editBtn0 = document.getElementById("evEdit");
    if(editBtn0) editBtn0.style.display = "none";
    // Récurrence : visible à la création
    const recField = document.getElementById("recurrenceField");
    if(recField) recField.style.display = "";
    const recSel = document.getElementById("evRecurrence");
    if(recSel){ recSel.value = "none"; }
    const recEnd = document.getElementById("recurrenceEndWrap");
    if(recEnd) recEnd.style.display = "none";
    const recEndDate = document.getElementById("evRecurrenceEnd");
    if(recEndDate) recEndDate.value = "2027-12-31";
  }

  // Mode lecture seule (Google/Outlook OU appli avant clic sur Modifier) :
  // désactiver tous les champs. Sur Android Chrome, les champs disabled peuvent
  // malgré tout déclencher le clavier au tap, d'où inputmode="none" + tabindex="-1".
  setFieldsReadonly(startReadonly);
  // S'assurer qu'aucun champ n'a le focus à l'ouverture en lecture seule
  if(startReadonly && document.activeElement && typeof document.activeElement.blur === "function"){
    document.activeElement.blur();
  }
  setupLocationGPS(startReadonly);
  setupCommentDisplay(startReadonly);

  modal.style.display = "flex";
  if(!startReadonly) setTimeout(()=>inTitle.focus(), 50);
}

// Active/désactive l'édition de tous les champs de la modale événement.
function setFieldsReadonly(readonly){
  const inTitle = document.getElementById("evTitle");
  const inDate = document.getElementById("evDate");
  const inHour = document.getElementById("evHour");
  const sel = document.getElementById("evAgenda");
  const inCom = document.getElementById("evComment");
  const inLoc = document.getElementById("evLocation");
  [inTitle, inDate, inHour, sel, inCom, inLoc].forEach(el => {
    el.disabled = !!readonly;
    if(readonly){
      el.setAttribute("inputmode", "none");
      el.setAttribute("tabindex", "-1");
      el.setAttribute("readonly", "readonly");
    } else {
      el.removeAttribute("inputmode");
      el.removeAttribute("tabindex");
      el.removeAttribute("readonly");
    }
  });
  setupLocationGPS(readonly);
  setupCommentDisplay(readonly);
}

// Échappe une chaîne pour l'insérer dans du HTML.
function escapeHtml(s){
  return s.replace(/[<>&"']/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
}

// Transforme les numéros de téléphone du texte en liens cliquables "tel:".
// Reconnait :
//   - 10 chiffres avec ou sans séparateurs : "06 12 34 56 78", "0612345678", "06.12.34.56.78", "06-12-34-56-78"
//   - format international : "+33 6 12 34 56 78", "+33612345678"
// Retourne du HTML (avec le texte échappé).
function linkifyPhones(text){
  // Pattern : un + suivi de 8..15 chiffres avec séparateurs, OU un 0 suivi de 9 chiffres avec séparateurs
  const re = /(\+\d[\d .\-]{7,18}\d|\b0\d(?:[ .\-]?\d){8})/g;
  let out = "", last = 0, m;
  while((m = re.exec(text)) !== null){
    out += escapeHtml(text.slice(last, m.index));
    const raw = m[0];
    // Nettoyer pour le href (uniquement chiffres et +)
    const cleaned = raw.replace(/[^\d+]/g, "");
    out += '<a href="tel:' + cleaned + '" class="tel-link">' + escapeHtml(raw) + '</a>';
    last = m.index + raw.length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

// Retire les numéros de téléphone d'un texte (et nettoie les espaces/lignes vides
// résiduelles), pour éviter qu'ils apparaissent deux fois (texte + pastille).
function stripPhones(text){
  const re = /(\+\d[\d .\-]{7,18}\d|\b0\d(?:[ .\-]?\d){8})/g;
  return text
    .split("\n")
    .map(line=>{
      // Remplacer chaque numéro par (📞)
      let cleaned = line.replace(re, "(📞)").replace(/\s{2,}/g, " ").trim();
      // Si la ligne ne contient plus que du junk (ponctuation, mots de liaison + 📞)
      // ex: "Tel : (📞)", "Contact : (📞)", on la retire entièrement
      const onlyJunk = /^[\s:：,;.\-(📞)]*$/.test(cleaned)
        || /^(tel|tél|téléphone|portable|mobile|contact|appeler|joindre)\s*[:：]?\s*(\(📞\))?\s*$/i.test(cleaned);
      return onlyJunk ? "" : cleaned;
    })
    .filter(line => line.length > 0)
    .join("\n");
}

// Extrait les numéros de téléphone d'un texte.
// Retourne un tableau d'objets { display: "06 12 34 56 78", cleaned: "0612345678" }.
function findPhones(text){
  const re = /(\+\d[\d .\-]{7,18}\d|\b0\d(?:[ .\-]?\d){8})/g;
  const out = [];
  const seen = new Set();
  let m;
  while((m = re.exec(text)) !== null){
    const raw = m[0];
    const cleaned = raw.replace(/[^\d+]/g, "");
    if(seen.has(cleaned)) continue;          // éviter doublons
    seen.add(cleaned);
    out.push({display: raw, cleaned});
  }
  return out;
}

// "9h30" ou "09h30" → "09:30" pour <input type=time>
function hourToInput(h){
  if(!h) return "";
  const m = h.match(/^(\d{1,2})[h:](\d{0,2})/);
  if(!m) return "";
  const hh = m[1].padStart(2,"0");
  const mm = (m[2] || "00").padStart(2,"0");
  return hh+":"+mm;
}
// "09:30" → "9h30" pour affichage et stockage uniforme
function inputToHour(v){
  if(!v) return "";
  const m = v.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return v;
  const h = parseInt(m[1],10);
  return m[2] === "00" ? h+"h" : h+"h"+m[2];
}

      link.href = url;
      link.textContent = "📄 Ouvrir la pièce jointe";
      uploadZone.style.display = "none";

  field.style.display = "";
  uploadZone.style.display = "";
  if(removeBtn) removeBtn.style.display = "";
  link.textContent = "📄 Voir le bon";

  const refresh = ()=>{
    if(currentAttachmentUrl){
      current.style.display = "flex";
      link.href = currentAttachmentUrl;
      btn.textContent = "📎 Remplacer le bon";
    } else {
      current.style.display = "none";
      btn.textContent = "📎 Joindre un bon";
    }
    msg.textContent = "";
  };
  refresh();

  // Bouton "Joindre / Remplacer"
  btn.onclick = ()=>{ fileInput.value = ""; fileInput.click(); };

  // Sélection du fichier → upload immédiat
  fileInput.onchange = async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(file.type !== "application/pdf"){
      msg.textContent = "Format PDF uniquement.";
      return;
    }
    if(file.size > 10 * 1024 * 1024){
      msg.textContent = "Fichier trop lourd (max 10 Mo).";
      return;
    }
    msg.textContent = "Envoi en cours…";
    btn.disabled = true;
    try{
      const url = await uploadBonLivraison(file);
      currentAttachmentUrl = url;
      refresh();
    }catch(err){
      msg.textContent = "Erreur lors de l'envoi : " + err.message;
    } finally {
      btn.disabled = false;
    }
  };

  // Bouton "Retirer"
  removeBtn.onclick = ()=>{
    currentAttachmentUrl = null;
    refresh();
  };
}

// Upload un PDF vers Supabase Storage (bucket "bons-livraison").
// Retourne l'URL publique du fichier.
async function uploadBonLivraison(file){
  if(!sb) throw new Error("Supabase non initialisé");
  const ext = file.name.split(".").pop() || "pdf";
  const filename = "bon_" + Date.now() + "." + ext;
  const { data, error } = await sb.storage
    .from("bons-livraison")
    .upload(filename, file, { cacheControl: "3600", upsert: false });
  if(error) throw new Error(error.message);
  const { data: urlData } = sb.storage
    .from("bons-livraison")
    .getPublicUrl(filename);
  return urlData.publicUrl;
}

async function saveEventFromModal(){
  const title = document.getElementById("evTitle").value.trim();
  const date = document.getElementById("evDate").value;
  const hourRaw = document.getElementById("evHour").value;
  const agenda = document.getElementById("evAgenda").value;
  const location = document.getElementById("evLocation").value.trim();
  const comment = document.getElementById("evComment").value.trim();
  const attachment = currentAttachmentUrl || null;
  const msg = document.getElementById("evMsg");

  if(!title){ msg.textContent = "Le titre est obligatoire."; return; }
  if(!date){ msg.textContent = "La date est obligatoire."; return; }
  if(!hourRaw){ msg.textContent = "L'heure est obligatoire."; return; }
  if(!agenda){ msg.textContent = "L'agenda est obligatoire."; return; }

  const hour = inputToHour(hourRaw);

  // Récurrence (uniquement à la création, pas en édition)
  const recSel = document.getElementById("evRecurrence");
  const recFreq = recSel ? recSel.value : "none";

  if(!evEditingId && recFreq !== "none"){
    // Création avec récurrence
    const recEndEl = document.getElementById("evRecurrenceEnd");
    const recEnd = recEndEl ? recEndEl.value : "";
    if(!recEnd){ msg.textContent = "Veuillez indiquer une date de fin."; return; }
    if(recEnd < date){ msg.textContent = "La date de fin doit être après la date de début."; return; }
    if(recEnd > "2027-12-31"){ msg.textContent = "La date de fin ne peut pas dépasser le 31/12/2027."; return; }

    // Calculer toutes les dates de l'occurrence
    const dates = computeRecurrenceDates(date, recEnd, recFreq);
    if(dates.length === 0){ msg.textContent = "Aucune date générée avec ces paramètres."; return; }
    if(dates.length > 60){ msg.textContent = "Trop d'occurrences (max 60). Réduisez la période."; return; }

    msg.textContent = "Création de " + dates.length + " événements…";
    // Identifiant commun à toutes les occurrences
    const recurrenceId = "rec_" + Date.now();
    let errors = 0;
    let errorMsg = "";
    for(const d of dates){
      const res = await createLocalEvent({ title, date: d, hour, agenda, location, comment, attachment, recurrence_id: recurrenceId });
      if(res.error){ errors++; errorMsg = res.error; }
    }
    if(errors > 0){ msg.textContent = errors + " erreur(s) : " + errorMsg; return; }
    closeEventModal();
  } else {
    // Création ou édition simple (sans récurrence)
    const values = { title, date, hour, agenda, location, comment, attachment };
    msg.textContent = "Enregistrement…";
    const fn = evEditingId
      ? updateLocalEvent(evEditingId, values)
      : createLocalEvent(values);
    const res = await fn;
    if(res.error){ msg.textContent = "Erreur : " + res.error; return; }
    closeEventModal();
  }
}

// Calcule toutes les dates d'une récurrence entre startDate et endDate.
function computeRecurrenceDates(startDate, endDate, freq){
  const dates = [];
  const d = new Date(startDate);
  const end = new Date(endDate);
  while(d <= end){
    // Ignorer les dimanches (getDay() === 0)
    if(d.getDay() !== 0){
      dates.push(fmt(d));
    }
    // Avancer selon la fréquence
    if(freq === "daily"){
      d.setDate(d.getDate() + 1);
    } else if(freq === "weekly"){
      d.setDate(d.getDate() + 7);
    } else if(freq === "biweekly"){
      d.setDate(d.getDate() + 14);
    } else if(freq === "monthly"){
      d.setMonth(d.getMonth() + 1);
    }
  }
  return dates;
}

async function deleteEventFromModal(){
  if(!evEditingId) return;
  const msg = document.getElementById("evMsg");

  // Vérifier si l'événement fait partie d'une récurrence
  const ev = findLocalEventById(evEditingId);
  if(ev && ev.recurrence_id){
    // Proposer de supprimer juste cet événement ou toute la série
    const choice = confirm(
      "Cet événement fait partie d'une série répétée.\n\n" +
      "OK → Supprimer TOUS les événements de la série\n" +
      "Annuler → Supprimer uniquement CET événement"
    );
    msg.textContent = "Suppression…";
    if(choice){
      // Supprimer toute la série
      const res = await deleteRecurrenceSeries(ev.recurrence_id);
      if(res.error){ msg.textContent = "Erreur : " + res.error; return; }
    } else {
      // Supprimer uniquement cet événement
      const res = await deleteLocalEvent(evEditingId);
      if(res.error){ msg.textContent = "Erreur : " + res.error; return; }
    }
  } else {
    if(!confirm("Supprimer cet événement ? Cette action est immédiate et définitive.")) return;
    msg.textContent = "Suppression…";
    const res = await deleteLocalEvent(evEditingId);
    if(res.error){ msg.textContent = "Erreur : " + res.error; return; }
  }
  closeEventModal();
}

// Cherche un événement local par son id
function findLocalEventById(id){
  for(const date in EVENTS_LOCAL){

  return null;
}

// Supprime tous les événements d'une série récurrente
async function deleteRecurrenceSeries(recurrenceId){
  if(!sb) return { error: "Supabase non initialisé" };
  try{
    const { error } = await sb.from("events")
      .delete()
      .eq("recurrence_id", recurrenceId);
    if(error) return { error: error.message };
    await loadLocalEvents();
    render();
    return {};
  }catch(e){
    return { error: e.message };
  }
}

// ---- dates ----
function fmt(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function mondayOf(d){
  const x = new Date(d);
  const wd = (x.getDay()+6)%7;
  x.setDate(x.getDate()-wd);
  x.setHours(0,0,0,0);
  return x;
}
function classify(val){
  if(!val) return null;
  if(val.startsWith("Segré")) return "Segré";
  if(val.startsWith("CHT")) return "CHT";
  if(val.startsWith("Sablé")) return "Sablé";
  if(val==="CP") return "CP";
  if(val==="Férié") return "Férié";
  if(val==="Recup"||val==="Arrêt") return "abs";
  return "abs";
}

// Retourne la liste des magasins présents dans une valeur (peut être 1 ou 2 entrées si AM/PM).
// Ex : "Segré" → ["Segré"] ; "Segré AM - Sablé PM" → ["Segré","Sablé"] ; "Repos" → [].
function classifyAll(val){
  if(!val) return [];
  const split = splitAMPM(val);
  if(split){
    const out = [];
    [split.am, split.pm].forEach(part=>{
      const c = classify(part);
      if(c && !out.includes(c)) out.push(c);
    });
    return out;
  }
  const c = classify(val);
  return c ? [c] : [];
}

// Retourne true si la case "val" est concernée par le filtre Magasin actif.
// filterStore vide = pas de filtre (tout passe). Sinon, true si au moins un magasin
// présent dans la case (AM ou PM) est dans la sélection.
function matchesStoreFilter(val){
  if(filterStore.size === 0) return true;
  const stores = classifyAll(val);
  return stores.some(s => filterStore.has(s));
}

// Détecte un libellé "X AM - Y PM" → { am:"X", pm:"Y" } ; sinon null.
function splitAMPM(val){
  if(!val) return null;
  const m = val.match(/^(.+?)\s+AM\s*-\s*(.+?)\s+PM\s*$/i);
  if(!m) return null;
  return { am: m[1].trim(), pm: m[2].trim() };
}

// Couleurs pour le rendu en diagonale.
function colorOf(part){
  const c = classify(part);
  switch(c){
    case "Segré": return { bg:"var(--segre-bg)", ink:"var(--segre)" };
    case "CHT":   return { bg:"var(--cht-bg)",   ink:"var(--cht)"   };
    case "Sablé": return { bg:"var(--sable-bg)", ink:"var(--sable)" };
    case "CP":    return { bg:"var(--cp-bg)",    ink:"var(--cp)"    };
    case "Férié": return { bg:"var(--ferie-bg)", ink:"var(--ferie)" };
    default:      return { bg:"var(--abs-bg)",   ink:"var(--abs)"   };
  }
}

// Construit le HTML d'une case scindée en diagonale (triangle haut-gauche / bas-droite).
function diagCellHTML(am, pm){
  const ca = colorOf(am), cp = colorOf(pm);
  // SVG en fond, deux triangles ; texte par-dessus, dans chaque coin.
  return ''
    + '<div class="diag">'
    +   '<svg class="diag-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
    +     '<polygon points="0,0 100,0 0,100" style="fill:'+ca.bg+'"/>'
    +     '<polygon points="100,0 100,100 0,100" style="fill:'+cp.bg+'"/>'
    +   '</svg>'
    +   '<span class="diag-am" style="color:'+ca.ink+'">'+am+'</span>'
    +   '<span class="diag-pm" style="color:'+cp.ink+'">'+pm+'</span>'
    + '</div>';
}

// Construit le widget d'édition (deux menus AM/PM côte à côte) pour une cellule en mode manager.
// `currentVal` est la valeur actuelle de la case (peut être null, "Segré", "Segré AM - Repos PM"...).
// `onCommit(newVal)` est appelée avec la nouvelle valeur ("" pour effacer, "X" simple, ou "X AM - Y PM").
function buildEditWidget(currentVal, onCommit){
  // Déterminer les valeurs initiales des deux selects
  let amInit = "", pmInit = "";
  const split = splitAMPM(currentVal);
  if(split){ amInit = split.am; pmInit = split.pm; }
  else if(currentVal){ amInit = currentVal; pmInit = currentVal; }

  const wrap = document.createElement("span");
  wrap.className = "editsplit";

  const makeSelect = (init, label)=>{
    const sel = document.createElement("select");
    sel.className = "editsel";
    sel.title = label;
    const blank = document.createElement("option");
    blank.value = ""; blank.textContent = "—";
    sel.appendChild(blank);
    OPTIONS.forEach(o=>{
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      if(init===o) op.selected = true;
      sel.appendChild(op);
    });
    // garder une valeur non standard si présente
    if(init && !OPTIONS.includes(init)){
      const op = document.createElement("option");
      op.value = init; op.textContent = init; op.selected = true;
      sel.appendChild(op);
    }
    return sel;
  };

  const selAM = makeSelect(amInit, "Matin");
  const selPM = makeSelect(pmInit, "Après-midi");

  const handleChange = ()=>{
    const am = selAM.value, pm = selPM.value;
    let newVal;
    if(!am && !pm) newVal = "";          // les deux vides → effacer
    else if(!am)   newVal = "Repos AM - "+pm+" PM";
    else if(!pm)   newVal = am+" AM - Repos PM";
    else if(am===pm) newVal = am;        // même valeur des deux côtés → valeur simple
    else           newVal = am+" AM - "+pm+" PM";
    onCommit(newVal);
  };
  selAM.onchange = handleChange;
  selPM.onchange = handleChange;

  wrap.appendChild(selAM);
  wrap.appendChild(selPM);
  return wrap;
}

  allChip.textContent = "Tous";
  allChip.onclick = ()=>{ filterStore.clear(); buildChips(); render(); };
  sc.appendChild(allChip);
  // Un chip par magasin, plusieurs cochables simultanément
  STORES.forEach(s=>{
    const c = document.createElement("div");
    c.className = "chip"+(filterStore.has(s)?" sel":"");
    c.textContent = s;
    c.onclick = ()=>{
      if(filterStore.has(s)) filterStore.delete(s);
      else filterStore.add(s);
      buildChips(); render();
    };
    sc.appendChild(c);
  });

  // Sélecteur Personne (déroulant) — alimenté dynamiquement par PEOPLE
  const ps = document.getElementById("personSelect");
  if(ps){
    ps.innerHTML = "";
    const allOpt = document.createElement("option");
    allOpt.value = "all"; allOpt.textContent = "Toutes";
    ps.appendChild(allOpt);
    PEOPLE.forEach(p=>{
      const o = document.createElement("option");
      o.value = p; o.textContent = p.split(" ")[0];
      ps.appendChild(o);
    });
    // Si la personne sélectionnée n'existe plus (après import), retomber sur "Toutes"
    if(filterPerson !== "all" && !PEOPLE.includes(filterPerson)) filterPerson = "all";
    ps.value = filterPerson;
    ps.onchange = ()=>{
      filterPerson = ps.value;
      try{ localStorage.setItem("filterPerson", filterPerson); }catch(e){}
      render();
    };
  }

  // Sélecteur ICS (export planning)
  const icsPs = document.getElementById("icsPersonSelect");
  if(icsPs){
    const prev = icsPs.value;
    icsPs.innerHTML = "";
    PEOPLE.forEach(p=>{
      const o = document.createElement("option");
      o.value = p; o.textContent = p.split(" ")[0];
      icsPs.appendChild(o);
    });
    if(PEOPLE.includes(prev)) icsPs.value = prev;
  }

  // Agendas : un bouton par agenda + un bouton « Tout / Aucun »
  const ac = document.getElementById("agendaChips");
  if(ac){
    ac.innerHTML = "";
    const allShown = hiddenAgendas.size===0;
    const allBtn = document.createElement("div");
    allBtn.className = "chip"+(allShown?" sel":"");
    allBtn.textContent = allShown ? "Tout masquer" : "Tout afficher";
    allBtn.onclick = ()=>{
      if(hiddenAgendas.size===0){
        GAGENDAS.forEach(a=>hiddenAgendas.add(a.name));
      } else {
        hiddenAgendas.clear();
      }
      saveHiddenAgendas();
      buildChips(); render();
    };
    ac.appendChild(allBtn);

    GAGENDAS.forEach(ag=>{
      const c = document.createElement("div");
      const active = !hiddenAgendas.has(ag.name);
      c.className = "chip chip-ag"+(active?" sel":"");
      if(active){
        c.style.background = ag.bg;
        c.style.borderColor = ag.color;
        c.style.color = ag.ink;
      } else {
        c.style.background = "";
        c.style.borderColor = "";
        c.style.color = "";
      }
      // pastille de couleur visible aussi quand le bouton est désactivé
      c.innerHTML = '<span class="gdot" style="background:'+ag.color+';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle"></span>'+ag.name;
      c.onclick = ()=>{
        if(hiddenAgendas.has(ag.name)) hiddenAgendas.delete(ag.name);
        else hiddenAgendas.add(ag.name);
        saveHiddenAgendas();
        buildChips(); render();
      };
      ac.appendChild(c);
    });
  }
}

          else DATA[ds].a[p] = newVal;
          saveData(); render();
        });
        td.appendChild(widget);
      } else {
        if(val){

          if(ampm){

// Construit et retourne une carte-jour complète pour la date d.
function buildDayCard(d){
  const ds = fmt(d);
  const rec = DATA[ds];
  const todayStr = fmt(new Date());
  const card = document.createElement("div");
  card.className = "daycard";
  if(rec && rec.f) card.classList.add("ferie");
  if(ds === todayStr) card.classList.add("today");

  // En-tête : jour + date
  const head = document.createElement("div");
  head.className = "dch";
  // Pour les jours, on aligne sur DAYNAMES (0=Lun..5=Sam), donc on indexe via getDay()
  const dayIdx = d.getDay() === 0 ? 6 : d.getDay() - 1; // Lun=0..Sam=5 (Dim=6 mais on ne l'affiche pas)
  head.innerHTML = '<span class="dcname">' + DAYNAMES[dayIdx] + '</span>'
    + '<span class="dcnum">' + d.getDate() + " " + MONTHS[d.getMonth()] + '</span>';
  if(rec && rec.f){
    const ft = document.createElement("span");
    ft.className = "dcferie";
    ft.textContent = "Férié";
    head.appendChild(ft);
  }
  card.appendChild(head);

  // Section "Présence" (uniquement si au moins une personne à afficher)
  const presenceFrag = document.createDocumentFragment();
  let presenceCount = 0;
  PEOPLE.forEach(p=>{
    if(filterPerson !== "all" && p !== filterPerson) return;
    const val = rec && rec.a ? rec.a[p] : undefined;
    const cls = classify(val);
    if(!matchesStoreFilter(val) && !editMode) return;
    if(!editMode && !(rec && rec.f) && (!val || val === "Repos")) return;

    const row = document.createElement("div");
    row.className = "prow";
    const nm = document.createElement("span");
    nm.className = "pname";
    nm.textContent = p.split(" ")[0];
    row.appendChild(nm);

    if(editMode){
      const widget = buildEditWidget(val, (newVal)=>{
        if(!DATA[ds]) DATA[ds] = {f:0, a:{}};
        if(!DATA[ds].a) DATA[ds].a = {};
        if(newVal === "") delete DATA[ds].a[p];
        else DATA[ds].a[p] = newVal;
        saveData(); render();
      });
      row.appendChild(widget);
    } else {
      const zone = document.createElement("span");
      zone.className = "affzone";
      if(val){
        const ampm = splitAMPM(val);
        if(ampm){
          const clsAM = classify(ampm.am) || "abs";
          const clsPM = classify(ampm.pm) || "abs";
          zone.innerHTML = '<span class="splithalf ' + clsAM + '">' + ampm.am + '</span>'
            + '<span class="splithalf ' + clsPM + '">' + ampm.pm + '</span>';
        } else {
          zone.innerHTML = '<span class="affsingle ' + (cls || "abs") + '">' + val + '</span>';
        }
      } else {
        zone.innerHTML = '<span class="affsingle abs">Repos</span>';
      }
      row.appendChild(zone);
    }
    presenceFrag.appendChild(row);
    presenceCount++;
  });

  if(presenceCount > 0){
    const presSep = document.createElement("div");
    presSep.className = "agsep-mobile";
    presSep.textContent = "Présence";
    card.appendChild(presSep);
    card.appendChild(presenceFrag);
  }


  // Section "Agenda"
  const dayEvs = ((GEVENTS[ds] || []).concat(EVENTS_LOCAL[ds] || []))
    .filter(e => !hiddenAgendas.has(e.name))
    .slice().sort((a,b)=>a.sortKey - b.sortKey);
  if(dayEvs.length){
    const sep = document.createElement("div");
    sep.className = "agsep-mobile";
    sep.textContent = "Agenda";
    card.appendChild(sep);
    dayEvs.forEach(ev=>{
      const r = document.createElement("div");
      r.className = "agev-mobile-row";
      r.style.background = ev.bg;
      r.style.color = ev.ink;
      r.title = ev.name + (ev.hour ? " — " + ev.hour : "");
      const safe = ev.title.replace(/[<>&]/g, s=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[s]));
      const hasPhone = !!(ev.comment && findPhones(ev.comment).length > 0);
      const hasLocation = !!ev.location;
      const hasContent = hasPhone || hasLocation || !!ev.comment;
      const isClickable = ev.isLocal || hasContent;
      let icons = "";
      if(hasPhone) icons += "\u{1F4DE}";
      if(hasLocation) icons += "\u{1F4CD}";
      if(!icons && ev.isLocal) icons = "\u{270E}";
      if(!icons && hasContent) icons = "\u{24D8}";
      r.innerHTML = '<b class="aghour" style="color:' + ev.ink + '">' + (ev.hour || "") + '</b>'
        + '<span class="agtxt">' + safe + '</span>'
        + (isClickable && icons ? '<span class="ageninfo" style="color:' + ev.ink + '">' + icons + '</span>' : '');
      if(ev.isLocal){
        r.classList.add("agev-local");
        r.style.cursor = "pointer";
        r.onclick = ()=>openEventModal(ev);
      } else if(ev.location || ev.comment){
        r.style.cursor = "pointer";
        r.onclick = ()=>openEventModal(ev, true);
      }
      card.appendChild(r);
    });
  }

  return card;
}

// Rend la vue mobile : liste de cartes-jour (lun-sam, semaine en cours puis suivantes, jusqu'à fin 2026).
function renderMobileList(){
  const lg = document.getElementById("listview");
  if(!lg) return;
  // Préserver le bouton "filtersBackdrop" qui n'est pas dans listview, donc rien à protéger.
  lg.innerHTML = "";

  // Point de départ : semaine en cours (ou 1er janvier 2026 si on est avant).
  const now = new Date();
  let startBase;
  if(now.getFullYear() < 2026) startBase = new Date(2026, 0, 1);
  else if(now.getFullYear() > 2027) startBase = new Date(2027, 11, 31);
  else startBase = now;
  const LIST_START = mondayOf(startBase);
  const LIST_END = new Date(2027, 11, 31);
  const todayStr = fmt(new Date());

  let weekStart = new Date(LIST_START);
  let weekIdx = 0;
  while(weekStart <= LIST_END){
    // En-tête de semaine
    const wEnd = new Date(weekStart); wEnd.setDate(wEnd.getDate() + 5);
    const wh = document.createElement("div");
    wh.className = "wkhead";
    wh.textContent = "Semaine du " + weekStart.getDate() + " " + MONTHS[weekStart.getMonth()]
      + " au " + wEnd.getDate() + " " + MONTHS[wEnd.getMonth()];
    if(fmt(weekStart) === fmt(mondayOf(new Date())))
      wh.id = "thisweek";
    lg.appendChild(wh);

    // 6 jours (lun-sam) ou 7 avec dimanche si mode perso déverrouillé
    const nbJoursMobile = persoUnlocked ? 7 : 6;
    for(let i = 0; i < nbJoursMobile; i++){
      const d = new Date(weekStart); d.setDate(d.getDate() + i);
      const card = buildDayCard(d);
      if(fmt(d) === todayStr) card.id = "today";
      lg.appendChild(card);
    }
    weekStart.setDate(weekStart.getDate() + 7);
    weekIdx++;
    if(weekIdx > 55) break; // sécurité
  }
}

// ---- Export ICS (planning d'une personne) ----
// Génère un fichier .ics téléchargeable contenant tous les jours de travail
// d'une personne donnée pour l'année 2026.
function generateIcs(person){
  const now = new Date();
  const dtStamp = now.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Planning Festicave//FR",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "X-WR-CALNAME:Planning " + person.split(" ")[0],
    "X-WR-TIMEZONE:Europe/Paris"
  ];

  // Parcourir tous les jours de DATA
  Object.keys(DATA).sort().forEach(ds=>{
    const rec = DATA[ds];
    if(!rec) return;
    // Ignorer les jours fériés (aucune affectation personnelle)
    if(rec.f) return;
    const val = rec.a ? rec.a[person] : undefined;
    if(!val || val === "Repos") return;

    // Construire la date au format YYYYMMDD
    const dateForIcs = ds.replace(/-/g, "");
    // Lendemain pour DTEND (journée entière)
    const dEnd = new Date(ds);
    dEnd.setDate(dEnd.getDate() + 1);
    const dateEndForIcs = fmt(dEnd).replace(/-/g, "");

    // UID unique
    const uid = "festicave-" + person.replace(/\s/g,"") + "-" + ds + "@festicave";

    lines.push("BEGIN:VEVENT");
    lines.push("UID:" + uid);
    lines.push("DTSTAMP:" + dtStamp + "Z");
    lines.push("DTSTART;VALUE=DATE:" + dateForIcs);
    lines.push("DTEND;VALUE=DATE:" + dateEndForIcs);
    lines.push("SUMMARY:" + escapeIcsText(val));
    lines.push("DESCRIPTION:Planning Festicave");
    lines.push("END:VEVENT");
  });

  lines.push("END:VCALENDAR");
  return lines.join("\r\n");
}

function escapeIcsText(s){
  return (s || "").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}

// Swipe horizontal sur la vue tableau pour changer de semaine.
// Actif uniquement en mode tableau (paysage / ordi), pas en vue mobile portrait.
(function setupSwipe(){
  const wrap = document.querySelector(".tablewrap");
  if(!wrap) return;
  let startX = 0, startY = 0, tracking = false;
  const THRESHOLD = 60;        // distance horizontale minimum pour valider
  const MAX_VERTICAL = 50;     // au-delà, c'est plutôt un scroll vertical → ignorer
  wrap.addEventListener("touchstart", (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  wrap.addEventListener("touchend", (e)=>{
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if(Math.abs(dy) > MAX_VERTICAL) return;     // scroll vertical : on laisse faire
    if(Math.abs(dx) < THRESHOLD) return;        // déplacement trop faible
    if(dx < 0) gotoNextWeek();                  // swipe gauche → semaine suivante
    else       gotoPrevWeek();                  // swipe droite → semaine précédente
  }, {passive:true});
})();
